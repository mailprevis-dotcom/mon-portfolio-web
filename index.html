<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --or: #FFD700; 
            --vert: #00FF7F; 
            --bleu-nuit: #111827;
            --gris-bleu: #1f2a38;
            --texte: #ecf0f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Arial', sans-serif; background-color: var(--gris-bleu); color: var(--texte); line-height: 1.6; }
        
        .header { background-color: #2c3e50; padding: 20px 0; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { height: 70px; width: 70px; background: white; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--or); font-weight: bold; border: 2px solid var(--or); }
        .header h1 { color: var(--or); font-size: 1.2rem; margin-top: 10px; text-transform: uppercase; padding: 0 10px; }

        .hero { background: var(--bleu-nuit); padding: 60px 20px; text-align: center; border-bottom: 4px solid var(--vert); }
        .hero h2 { color: var(--or); font-size: 2rem; margin-bottom: 20px; }
        
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid var(--vert); }
        .stat-num { display: block; font-size: 1.5rem; font-weight: bold; color: var(--or); }

        .socials { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .socials a { font-size: 2.5rem; text-decoration: none; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

        /* GALERIE */
        .galerie { padding: 40px 20px; text-align: center; background: #1a222c; }
        .galerie h2 { color: var(--or); border-bottom: 2px solid var(--vert); display: inline-block; margin-bottom: 30px; }
        #cont-photos { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; }
        .card img { width: 100%; display: block; }
        
        /* ADMIN */
        .admin-zone { margin-top: 50px; border-top: 1px solid #333; padding-top: 20px; }
        .btn-gestion { background: transparent; color: #555; border: 1px solid #444; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 10px; }
        #admin-panel { display: none; background: #000; padding: 20px; border-radius: 10px; border: 1px solid var(--or); margin-top: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        .btn-publier { background: var(--or); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; }

        @media (min-width: 768px) {
            #cont-photos { grid-template-columns: repeat(2, 1fr); }
            .stats { grid-template-columns: repeat(3, 1fr); max-width: 600px; margin: 30px auto; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC GLOBAL INVESTISSEMENT</h1>
    </header>

    <section class="hero">
        <h2>NOS EXPLOITS</h2>
        <p>Découvrez notre parcours sur nos réseaux sociaux.</p>
        <div class="stats">
            <div class="stat-card"><span class="stat-num">150+</span><span>Photos</span></div>
            <div class="stat-card"><span class="stat-num">25</span><span>Vidéos</span></div>
            <div class="stat-card" style="grid-column: span 2;"><span class="stat-num">5k+</span><span>Abonnés</span></div>
        </div>
        <div class="socials">
            <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        </div>
    </section>

    <section class="galerie">
        <h2>PROJETS RÉCENTS</h2>
        <div id="cont-photos">
            <p style="opacity:0.3">Les photos apparaîtront ici...</p>
        </div>

        <div class="admin-zone">
            <button class="btn-gestion" id="btn-adm-toggle">ACCÈS ADMIN</button>
            <div id="admin-panel">
                <input type="password" id="pass" placeholder="Mot de passe">
                <button onclick="checkPass()" class="btn-publier">CONNEXION</button>
                <div id="upload-form" style="display:none; margin-top:20px;">
                    <input type="url" id="img-url" placeholder="Lien de la photo (URL)">
                    <button onclick="saveImg()" class="btn-publier" style="background:var(--vert)">PUBLIER</button>
                </div>
            </div>
        </div>
    </section>

    <footer style="text-align:center; padding:30px; background:#111; font-size:10px; color:#555;">
        &copy; 2025 LVD GLOBAL INVESTISSEMENT
    </footer>

    <script>
        // SYSTÈME DE STOCKAGE LOCAL (Fonctionne partout sans config)
        let photos = JSON.parse(localStorage.getItem('lvd_photos') || '[]');
        let isAdmin = false;

        function render() {
            const container = document.getElementById('cont-photos');
            if(photos.length === 0) {
                container.innerHTML = "<p style='opacity:0.2'>Aucune photo publiée.</p>";
                return;
            }
            container.innerHTML = photos.map((p, index) => `
                <div class="card">
                    <img src="${p}" onerror="this.src='https://placehold.co/400x300?text=Lien+Invalide'">
                    ${isAdmin ? <button onclick="deleteImg(${index})" style="position:absolute; top:10px; right:10px; background:red; color:white; border:none; padding:5px; border-radius:5px;">Supprimer</button> : ''}
                </div>
            `).join('');
        }

        document.getElementById('btn-adm-toggle').onclick = () => {
            document.getElementById('admin-panel').style.display = 'block';
        };

        window.checkPass = () => {
            if(document.getElementById('pass').value.toUpperCase() === "LVD2024") {
                isAdmin = true;
                document.getElementById('upload-form').style.display = 'block';
                document.getElementById('pass').style.display = 'none';
                document.querySelector('#admin-panel button').style.display = 'none';
                render();
            } else {
                alert("Mot de passe incorrect");
            }
        };

        window.saveImg = () => {
            const url = document.getElementById('img-url').value;
            if(!url) return;
            photos.unshift(url);
            localStorage.setItem('lvd_photos', JSON.stringify(photos));
            document.getElementById('img-url').value = '';
            render();
            alert("Photo ajoutée sur cet appareil !");
        };

        window.deleteImg = (index) => {
            if(confirm("Supprimer ?")) {
                photos.splice(index, 1);
                localStorage.setItem('lvd_photos', JSON.stringify(photos));
                render();
            }
        };

        render();
    </script>
</body>
</html>
