<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    <style>
        :root {
            --gold: #D4AF37;
            --bg-black: #050505;
            --card-bg: #121212;
            --text-white: #ffffff;
            --text-muted: #888888;
            
            /* Couleurs Réseaux Sociaux Fixes */
            --color-whatsapp: #25D366;
            --color-facebook: #1877F2;
            --color-instagram: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --color-tiktok: #000000;
            --color-x: #000000;
            --color-google: #4285F4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(180deg, #111, var(--bg-black));
        }

        .logo-main {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .logo-main span {
            color: #000;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* NAVIGATION SOCIALE COULEURS FIXES */
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .icon-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .icon-box:hover { transform: scale(1.1); }
        .icon-box svg { width: 26px; height: 26px; fill: white; }

        .wa-bg { background-color: var(--color-whatsapp); }
        .fb-bg { background-color: var(--color-facebook); }
        .ig-bg { background: var(--color-instagram); }
        .tk-bg { background-color: var(--color-tiktok); border: 1px solid #333; }
        .x-bg { background-color: var(--color-x); border: 1px solid #333; }
        .gg-bg { background-color: var(--color-google); }

        /* GALERIE */
        section {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .section-title::after {
            content: ''; display: block; width: 60px; height: 2px; background: var(--gold); margin: 15px auto;
        }

        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .media-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            position: relative;
            transition: 0.3s;
        }

        .media-item:hover { border-color: var(--gold); }

        .media-item img, .media-item iframe {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            object-fit: cover;
            border: none;
        }

        .empty-status {
            grid-column: 1/-1;
            text-align: center;
            padding: 100px 20px;
            color: #555;
            font-style: italic;
        }

        /* ZONE D'ADMINISTRATION */
        .admin-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 30px;
            max-width: 450px;
            margin: 40px auto;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: 800;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .btn-del {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff3b30;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        .hidden { display: none; }

        footer {
            padding: 80px 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #333;
            border-top: 1px solid #111;
        }

        /* LE BOUTON POUR TOI */
        .btn-config {
            cursor: pointer;
            color: #222; /* Très sombre pour être discret */
            font-weight: bold;
            text-decoration: underline;
            margin-top: 10px;
            display: inline-block;
        }
        .btn-config:hover { color: var(--gold); }
    </style>
</head>

<section>
    <h2 class="section-title">RÉALISATIONS</h2>
    <div id="gallery-container" class="grid-gallery">
        <!-- Rempli par JS -->
    </div>

    <!-- PANNEAU ADMIN MASQUÉ -->
    <div id="admin-panel" class="hidden">
        <div class="admin-box">
            <div id="auth-section">
                <h3>VÉRIFICATION</h3>
                <input type="password" id="pass-code" placeholder="Entrez le code">
                <button class="btn-gold" onclick="checkPass()">Accéder</button>
            </div>
            <div id="manage-section" class="hidden">
                <h3>AJOUTER UN MÉDIA</h3>
                <select id="m-type">
                    <option value="image">Photo (Lien URL)</option>
                    <option value="video">Vidéo (Lien YouTube)</option>
                </select>
                <input type="text" id="m-url" placeholder="Collez l'URL ici">
                <button class="btn-gold" onclick="pushMedia()">Mettre en ligne</button>
            </div>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2025 LVD Global Investissement. Confidentialité assurée.</p>
    <!-- CE BOUTON OUVRE LE PANNEAU -->
    <div class="btn-config" onclick="openAdmin()">Configuration</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

<script>
    const fbCfg = JSON.parse(__firebase_config);
    firebase.initializeApp(fbCfg);
    const db = firebase.firestore();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v5-final';
    const store = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

    let isUnlocked = false;

    firebase.auth().signInAnonymously();

    function openAdmin() {
        document.getElementById('admin-panel').classList.toggle('hidden');
    }

    function checkPass() {
        if(document.getElementById('pass-code').value === "1234") {
            isUnlocked = true;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('manage-section').classList.remove('hidden');
            render();
        } else { alert("Code refusé."); }
    }

    function render() {
        store.orderBy('ts', 'desc').onSnapshot(snap => {
            const grid = document.getElementById('gallery-container');
            if(snap.empty) {
                grid.innerHTML = '<div class="empty-status">Aucun projet pour le moment. Utilisez le panneau Configuration pour en ajouter.</div>';
                return;
            }
            grid.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'media-item';
                
                if(item.type === 'video') {
                    const id = item.url.includes('v=') ? item.url.split('v=')[1].split('&')[0] : item.url.split('/').pop();
                    card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>;
                } else {
                    card.innerHTML = <img src="${item.url}" onerror="this.src='https://placehold.co/800x450/111/D4AF37?text=Projet+LVD'">;
                }

                if(isUnlocked) {
                    const d = document.createElement('button');
                    d.className = 'btn-del'; d.innerText = 'Supprimer';
                    d.onclick = () => { if(confirm('Supprimer ?')) doc.ref.delete(); };
                    card.appendChild(d);
                }
                grid.appendChild(card);
            });
        });
    }

    async function pushMedia() {
        const url = document.getElementById('m-url').value;
        const type = document.getElementById('m-type').value;
        if(!url) return;
        await store.add({ url, type, ts: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('m-url').value = "";
    }

    render();
</script>
</body>
