<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    
    <style>
        :root { --or: #FFD700; --noir: #05080a; --carte: #111b27; }
        body { background: var(--noir); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        
        header { padding: 40px 20px; border-bottom: 1px solid #1e293b; }
        /* Le clic sur le logo ouvre la zone secrète */
        .logo-secret { 
            width: 70px; height: 70px; background: white; color: black; 
            border-radius: 50%; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 3px solid var(--or); cursor: pointer;
        }
        h1 { color: var(--or); font-size: 1.2rem; margin: 0; letter-spacing: 2px; }

        /* RÉSEAUX SOCIAUX - IMAGES DE SECOURS */
        .social-nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 25px; }
        .social-btn { 
            background: var(--carte); padding: 12px; border-radius: 12px; 
            text-decoration: none; color: white; width: 65px; border: 1px solid #1e293b;
        }
        .social-btn img { width: 30px; height: 30px; }
        .social-btn span { display: block; font-size: 8px; margin-top: 6px; font-weight: bold; }

        /* GALERIE */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: var(--carte); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }

        /* ZONE ADMIN CACHÉE */
        .admin-box { 
            display: none; padding: 40px 20px; background: #080c14; 
            border-top: 2px solid var(--or); margin-top: 40px; 
        }
        .input-field { 
            width: 90%; max-width: 300px; padding: 15px; margin: 10px 0; 
            border-radius: 8px; border: 1px solid #333; background: #000; color: white; 
        }
        .btn-gold { 
            background: var(--or); color: black; border: none; 
            padding: 15px; border-radius: 8px; font-weight: bold; width: 90%; max-width: 300px;
        }
        .hidden { display: none; }
        .del-mark { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; border-radius: 5px; padding: 5px 10px; }
    </style>
</head>
<body>

    <header>
        <!-- Cliquez ici pour faire apparaître la connexion -->
        <div class="logo-secret" onclick="toggleAdmin()">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 10px; opacity: 0.5; letter-spacing: 3px;">GLOBAL INVESTISSEMENT</p>
    </header>

    <div class="social-nav">
        <a href="https://wa.me/2693246465" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><span>WHATSAPP</span></a>
        <a href="https://www.instagram.com/la_villa_dionysienne" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"><span>INSTAGRAM</span></a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/124/124010.png"><span>FACEBOOK</span></a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"><span>TIKTOK</span></a>
        <a href="https://x.com/LDyonisienne" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png"><span>X</span></a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="social-btn"><img src="https://cdn-icons-png.flaticon.com/512/854/854878.png"><span>ADRESSE</span></a>
    </div>

    <h2 style="font-weight: 300; letter-spacing: 2px;">RÉALISATIONS</h2>
    <div id="gallery-wrap" class="gallery"></div>

    <div id="admin-area" class="admin-box">
        <div id="login-step">
            <h3 style="color:var(--or)">CONNEXION</h3>
            <input type="password" id="pass-field" class="input-field" placeholder="Entrez le code secret">
            <button class="btn-gold" onclick="access()">DÉBLOQUER</button>
        </div>

        <div id="post-step" class="hidden">
            <h3 style="color:var(--or)">AJOUTER UN PROJET</h3>
            <select id="m-type" class="input-field">
                <option value="img">IMAGE</option>
                <option value="vid">YOUTUBE</option>
            </select>
            <input type="text" id="m-url" class="input-field" placeholder="Lien URL du contenu">
            <button class="btn-gold" onclick="send()">PUBLIER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v-pause';
        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let isAdmin = false;
        firebase.auth().signInAnonymously();

        function toggleAdmin() {
            const area = document.getElementById('admin-area');
            area.style.display = (area.style.display === 'block') ? 'none' : 'block';
        }

        function access() {
            const p = document.getElementById('pass-field').value.toUpperCase();
            if(p === "LVD2024") {
                isAdmin = true;
                document.getElementById('login-step').classList.add('hidden');
                document.getElementById('post-step').classList.remove('hidden');
                load();
            } else {
                alert("Code erroné");
            }
        }

        function load() {
            col.orderBy('date', 'desc').onSnapshot(snap => {
                const wrap = document.getElementById('gallery-wrap');
                wrap.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const c = document.createElement('div');
                    c.className = "card";
                    if(d.type === 'vid') {
                        const id = d.url.split('v=')[1] || d.url.split('/').pop();
                        c.innerHTML = <iframe src="https://www.youtube.com/embed/${id}"></iframe>;
                    } else {
                        c.innerHTML = <img src="${d.url}">;
                    }
                    if(isAdmin) {
                        const b = document.createElement('button');
                        b.className = "del-mark"; b.innerText = "SUPPRIMER";
                        b.onclick = () => { if(confirm("Effacer ?")) doc.ref.delete(); };
                        c.appendChild(b);
                    }
                    wrap.appendChild(c);
                });
            });
        }

        async function send() {
            const u = document.getElementById('m-url').value;
            const t = document.getElementById('m-type').value;
            if(!u) return;
            try {
                await col.add({ url: u, type: t, date: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('m-url').value = "";
                alert("Publié !");
            } catch(e) { alert("Erreur"); }
        }

        load();
    </script>
</body>
</html>
