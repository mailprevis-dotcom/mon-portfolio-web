<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD GLOBAL INVESTISSEMENT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --or: #FFD700;
            --vert: #00FF7F;
            --fond: #111827;
            --carte: #1f2a38;
            --texte: #ecf0f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--fond); color: var(--texte); overflow-x: hidden; }

        .header { background: var(--carte); padding: 20px; text-align: center; border-bottom: 2px solid var(--or); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo-c { height: 60px; width: 60px; background: #fff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--or); border: 2px solid var(--or); }
        
        .hero { padding: 40px 20px; text-align: center; background: #000; border-bottom: 4px solid var(--vert); }
        .hero h2 { color: var(--or); text-transform: uppercase; margin-bottom: 15px; }

        .social-links { display: flex; justify-content: center; gap: 25px; margin-top: 15px; }
        .social-links a { font-size: 2.2rem; text-decoration: none; transition: 0.3s; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

        .galerie-container { padding: 30px 15px; min-height: 300px; }
        #galerie-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .photo-item { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; position: relative; }
        .photo-item img { width: 100%; display: block; }
        .photo-item iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* Admin */
        .admin-footer { margin-top: 50px; padding: 20px; text-align: center; border-top: 1px solid #333; }
        #admin-panel { display: none; background: #000; padding: 20px; border-radius: 15px; border: 1px solid var(--or); max-width: 400px; margin: 20px auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; }
        .btn-lvd { background: var(--or); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-del { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: #fff; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }

        @media (min-width: 768px) { #galerie-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-c">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC GLOBAL</h1>
    </header>

    <section class="hero">
        <h2>RÉALISATIONS & EXPLOITS</h2>
        <div class="social-links">
            <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        </div>
    </section>

    <div class="galerie-container">
        <div id="galerie-grid">
            <!-- Les photos s'afficheront ici sans délai -->
        </div>
    </div>

    <div class="admin-footer">
        <button onclick="showLogin()" id="btn-adm-start" style="background:transparent; border:none; color:#444; font-size:12px; cursor:pointer;">ACCÈS GESTION</button>
        
        <div id="admin-panel">
            <div id="login-form">
                <input type="password" id="pass" placeholder="Mot de passe">
                <button class="btn-lvd" onclick="checkAuth()">Connexion</button>
            </div>
            
            <div id="upload-form" style="display:none;">
                <h3 style="color:var(--or); margin-bottom:10px;">AJOUTER UN CONTENU</h3>
                <select id="post-type">
                    <option value="img">IMAGE (Lien URL)</option>
                    <option value="vid">YOUTUBE (Lien URL)</option>
                </select>
                <input type="url" id="post-url" placeholder="Lien direct (http...)">
                <button class="btn-lvd" onclick="addPost()" style="background:var(--vert)">Publier</button>
                <button onclick="location.reload()" style="background:none; border:none; color:red; margin-top:15px; cursor:pointer;">Déconnexion</button>
            </div>
        </div>
    </div>

    <footer style="text-align:center; padding:30px; font-size:10px; color:#333;">
        &copy; 2025 LVD GLOBAL INVESTISSEMENT
    </footer>

    <script>
        // SYSTEME DE STOCKAGE INDÉPENDANT (Fonctionne même sans internet/cloud)
        let posts = JSON.parse(localStorage.getItem('lvd_save_v1') || '[]');
        let isAdmin = false;

        function showLogin() {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('btn-adm-start').style.display = 'none';
        }

        function checkAuth() {
            const p = document.getElementById('pass').value.toUpperCase();
            if(p === "LVD2024") {
                isAdmin = true;
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('upload-form').style.display = 'block';
                render();
                alert("Accès Gestionnaire Activé");
            } else {
                alert("Mot de passe incorrect");
            }
        }

        function render() {
            const grid = document.getElementById('galerie-grid');
            if(posts.length === 0) {
                grid.innerHTML = '<p style="text-align:center; opacity:0.2; grid-column:1/-1; padding:50px;">AUCUNE PHOTO PUBLIÉE</p>';
                return;
            }

            grid.innerHTML = posts.map((item, index) => `
                <div class="photo-item">
                    ${item.type === 'vid' ? 
                        <iframe src="https://www.youtube.com/embed/${getYTId(item.url)}" allowfullscreen></iframe> : 
                        <img src="${item.url}" onerror="this.src='https://placehold.co/400x300?text=Lien+Image+Invalide'">
                    }
                    ${isAdmin ? <button class="btn-del" onclick="deletePost(${index})"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        function getYTId(url) {
            try {
                return url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
            } catch(e) { return ''; }
        }

        function addPost() {
            const url = document.getElementById('post-url').value.trim();
            const type = document.getElementById('post-type').value;
            if(!url) return alert("Veuillez entrer un lien");

            posts.unshift({ url, type, id: Date.now() });
            localStorage.setItem('lvd_save_v1', JSON.stringify(posts));
            document.getElementById('post-url').value = '';
            render();
            alert("Publié avec succès !");
        }

        function deletePost(index) {
            if(confirm("Supprimer ce contenu ?")) {
                posts.splice(index, 1);
                localStorage.setItem('lvd_save_v1', JSON.stringify(posts));
                render();
            }
        }

        // Lancement immédiat au chargement
        render();
    </script>
</body>
</html>
