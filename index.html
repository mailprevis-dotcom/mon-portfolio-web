<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD GLOBAL INVESTISSEMENT</title>
    <!-- Chargement des icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --or: #FFD700;
            --vert: #00FF7F;
            --fond: #0a0f18;
            --carte: #161e2b;
            --texte: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', sans-serif; }
        
        body { 
            background-color: var(--fond); 
            color: var(--texte);
            line-height: 1.6;
        }

        /* En-tête */
        .header {
            background: linear-gradient(to bottom, #1c2535, var(--fond));
            padding: 30px 15px;
            text-align: center;
            border-bottom: 3px solid var(--or);
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 24px;
            border: 4px solid var(--or);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.05);
            padding: 15px 0;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        /* Section Titre */
        .hero {
            padding: 40px 20px;
            text-align: center;
        }

        .hero h2 {
            color: var(--or);
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .divider {
            height: 4px;
            width: 80%;
            background: var(--vert);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        /* Grille de photos */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px 100px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--carte);
            border-radius: 15px;
            border: 1px solid #2d3748;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }

        .card img, .card iframe {
            width: 100%;
            display: block;
            border: none;
            aspect-ratio: 4/3;
            object-fit: cover;
        }

        /* Système de Gestion */
        .admin-trigger {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--or);
            color: black;
            padding: 10px 15px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            z-index: 1000;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--carte);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--or);
        }

        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            font-size: 16px;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-primary { background: var(--or); color: black; }
        .btn-success { background: var(--vert); color: black; }
        .btn-close { background: #555; color: white; margin-top: 20px; }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Réseaux sociaux */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .socials i { font-size: 30px; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

    </style>
</head>
<body>

    <button class="admin-trigger" onclick="toggleModal('login-modal')">
        <i class="fas fa-lock"></i> GESTION
    </button>

    <header class="header">
        <div class="logo-circle">LVD</div>
        <h1 style="font-size: 22px; color: var(--or);">LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 14px; opacity: 0.8; margin-top: 5px;">GLOBAL INVESTISSEMENT</p>
    </header>

    <div class="nav-bar">
        <span>Accueil</span>
        <span>Réalisations</span>
        <span>Contact</span>
    </div>

    <section class="hero">
        <h2>NOS PROJETS EN DIRECT</h2>
        <div class="divider"></div>
        <div class="socials">
            <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        </div>
    </section>

    <div class="container">
        <div id="main-grid" class="grid">
            <!-- Les photos s'affichent ici -->
        </div>
    </div>

    <!-- MODAL CONNEXION -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; color:var(--or); margin-bottom:20px;">CONNEXION</h2>
            <input type="password" id="admin-pass" placeholder="Entrez le mot de passe...">
            <button class="btn-action btn-primary" onclick="verifyPass()">OK</button>
            <button class="btn-action btn-close" onclick="toggleModal('login-modal')">Annuler</button>
        </div>
    </div>

    <!-- MODAL AJOUT (Visible après connexion) -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; color:var(--vert); margin-bottom:20px;">PUBLIER</h2>
            <select id="item-type">
                <option value="img">IMAGE (Lien URL)</option>
                <option value="vid">YOUTUBE (Lien URL)</option>
            </select>
            <input type="url" id="item-url" placeholder="Collez le lien ici (http...)">
            <button class="btn-action btn-success" onclick="saveItem()">PUBLIER MAINTENANT</button>
            <button class="btn-action btn-close" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <script>
        // DONNÉES LOCALES (Pas besoin de cloud externe pour cette version fixe)
        let data = JSON.parse(localStorage.getItem('lvd_portfolio_db') || '[]');
        let isUserAdmin = false;

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function verifyPass() {
            const p = document.getElementById('admin-pass').value.toUpperCase();
            if(p === "LVD2024") {
                isUserAdmin = true;
                toggleModal('login-modal');
                toggleModal('add-modal');
                render();
            } else {
                alert("Mot de passe incorrect");
            }
        }

        function render() {
            const grid = document.getElementById('main-grid');
            if(data.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; opacity:0.5;">Aucun projet publié pour le moment.</p>';
                return;
            }

            grid.innerHTML = data.map((item, index) => `
                <div class="card">
                    ${item.type === 'vid' ? 
                        <iframe src="https://www.youtube.com/embed/${getYoutubeId(item.url)}"></iframe> : 
                        <img src="${item.url}" onerror="this.src='https://placehold.co/600x400/161e2b/FFD700?text=Image+Indisponible'">
                    }
                    ${isUserAdmin ? <button class="delete-btn" onclick="deleteItem(${index})"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        function getYoutubeId(url) {
            const regExp = /^.(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : '';
        }

        function saveItem() {
            const url = document.getElementById('item-url').value.trim();
            const type = document.getElementById('item-type').value;

            if(!url) return alert("Veuillez coller un lien");

            data.unshift({ url, type, ts: Date.now() });
            localStorage.setItem('lvd_portfolio_db', JSON.stringify(data));
            document.getElementById('item-url').value = '';
            render();
            alert("Publié avec succès !");
        }

        function deleteItem(index) {
            if(confirm("Supprimer définitivement cette photo ?")) {
                data.splice(index, 1);
                localStorage.setItem('lvd_portfolio_db', JSON.stringify(data));
                render();
            }
        }

        function logout() {
            isUserAdmin = false;
            toggleModal('add-modal');
            render();
        }

        // Démarrage
        render();
    </script>
</body>
</html>
