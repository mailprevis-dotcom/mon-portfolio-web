<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    
    <style>
        body { 
            background-color: #05080a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            text-align: center; 
        }
        
        .top-bar { padding: 40px 20px; border-bottom: 1px solid #1e293b; }
        .logo { 
            width: 70px; height: 70px; background: white; color: black; 
            border-radius: 50%; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 3px solid #FFD700; font-size: 24px;
        }
        h1 { color: #FFD700; font-size: 1.2rem; margin: 0; letter-spacing: 2px; }

        /* RÉSEAUX SOCIAUX */
        .social-box { 
            display: flex; justify-content: center; gap: 15px; 
            flex-wrap: wrap; padding: 20px; 
        }
        .icon-link { 
            background: #111827; padding: 12px; border-radius: 12px; 
            text-decoration: none; color: white; width: 65px; 
            border: 1px solid #1e293b; 
        }
        .icon-link img { width: 30px; height: 30px; }
        .icon-link span { display: block; font-size: 8px; margin-top: 5px; font-weight: bold; color: #FFD700; }

        /* GALERIE */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; padding: 20px; 
        }
        .item-card { 
            background: #111827; border-radius: 15px; overflow: hidden; 
            border: 1px solid #1e293b; position: relative;
        }
        .item-card img, .item-card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }

        /* GESTION ADMIN */
        .admin-section { 
            background: #0a0f1a; border-top: 3px solid #FFD700; 
            padding: 40px 20px; margin-top: 60px; 
        }
        .input-style { 
            width: 100%; max-width: 300px; padding: 15px; 
            margin: 10px 0; border-radius: 10px; border: 1px solid #334155; 
            background: #000; color: white; font-size: 16px; text-align: center;
        }
        .action-btn { 
            background: #FFD700; color: black; border: none; 
            padding: 15px 30px; border-radius: 10px; font-weight: bold; 
            cursor: pointer; width: 100%; max-width: 300px; font-size: 16px;
        }
        .hidden { display: none; }
        .del-button { 
            position: absolute; top: 10px; right: 10px; 
            background: #ff4444; color: white; border: none; 
            padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 10px; opacity: 0.5; letter-spacing: 3px;">GLOBAL INVESTISSEMENT</p>
    </div>

    <!-- RÉSEAUX SOCIAUX -->
    <div class="social-box">
        <a href="https://wa.me/2693246465" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><span>WHATSAPP</span>
        </a>
        <a href="https://www.instagram.com/la_villa_dionysienne" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"><span>INSTAGRAM</span>
        </a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png"><span>FACEBOOK</span>
        </a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"><span>TIKTOK</span>
        </a>
        <a href="https://x.com/LDyonisienne" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png"><span>X</span>
        </a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="icon-link">
            <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png"><span>CARTE</span>
        </a>
    </div>

    <h2 style="font-weight: 300; letter-spacing: 2px;">RÉALISATIONS</h2>
    
    <div id="gallery-container" class="grid">
        <p style="opacity:0.2">Chargement du contenu...</p>
    </div>

    <!-- ZONE D'ADMINISTRATION -->
    <div class="admin-section">
        <!-- Étape 1 : Saisie Code -->
        <div id="step-login">
            <h3 style="color:#FFD700">ACCÈS ADMINISTRATEUR</h3>
            <input type="password" id="pass-box" class="input-style" placeholder="Code secret (Ex: LVD2024)">
            <br>
            <button class="action-btn" onclick="verifierLeCode()">OUVRIR LA GESTION</button>
        </div>

        <!-- Étape 2 : Ajout Liens -->
        <div id="step-upload" class="hidden">
            <h3 style="color:#FFD700">PUBLIER UN PROJET</h3>
            <select id="media-type" class="input-style">
                <option value="img">IMAGE</option>
                <option value="vid">YOUTUBE</option>
            </select>
            <input type="text" id="media-url" class="input-style" placeholder="Collez le lien URL ici">
            <br>
            <button class="action-btn" onclick="envoyerContenu()">METTRE EN LIGNE</button>
            <p><button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; font-size:12px; text-decoration:underline;">DÉCONNEXION</button></p>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v-final';
        const collection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let isLogged = false;

        firebase.auth().signInAnonymously();

        // FONCTION DE CONNEXION
        function verifierLeCode() {
            const code = document.getElementById('pass-box').value.toUpperCase();
            if(code === "LVD2024") {
                isLogged = true;
                document.getElementById('step-login').classList.add('hidden');
                document.getElementById('step-upload').classList.remove('hidden');
                refreshGallery(); 
            } else {
                alert("Code incorrect !");
            }
        }

        // CHARGEMENT GALERIE
        function refreshGallery() {
            collection.orderBy('date', 'desc').onSnapshot(snap => {
                const gallery = document.getElementById('gallery-container');
                gallery.innerHTML = "";
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = "item-card";
                    
                    if(data.type === 'vid') {
                        const id = data.url.split('v=')[1] || data.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}"></iframe>;
                    } else {
                        card.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/400x250?text=Lien+Invalide'">;
                    }

                    if(isLogged) {
                        const del = document.createElement('button');
                        del.className = "del-button"; del.innerText = "SUPPRIMER";
                        del.onclick = () => { if(confirm("Supprimer ce projet ?")) doc.ref.delete(); };
                        card.appendChild(del);
                    }
                    gallery.appendChild(card);
                });
            });
        }

        // PUBLICATION
        async function envoyerContenu() {
            const u = document.getElementById('media-url').value;
            const t = document.getElementById('media-type').value;
            if(!u) return alert("Veuillez coller un lien.");

            try {
                await collection.add({
                    url: u,
                    type: t,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('media-url').value = "";
                alert("Publié avec succès !");
            } catch(e) {
                alert("Erreur technique.");
            }
        }

        refreshGallery();
    </script>
</body>
</html>
