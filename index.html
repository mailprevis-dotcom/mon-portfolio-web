<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global - Investissement</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --or: #FFD700; --fond: #05080a; --carte: #111827; }
        body { background: var(--fond); color: white; font-family: sans-serif; margin: 0; text-align: center; padding-bottom: 100px; }
        
        header { padding: 40px 20px; }
        .logo-cercle { width: 70px; height: 70px; background: white; color: black; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--or); }
        h1 { color: var(--or); font-size: 1.2rem; margin: 0; letter-spacing: 1px; }

        /* Grille des réseaux sociaux */
        .social-links { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .social-links a { color: white; text-decoration: none; font-size: 1.5rem; }
        .fa-whatsapp { color: #25D366; } .fa-instagram { color: #E4405F; } .fa-facebook { color: #1877F2; }

        /* Galerie */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: var(--carte); border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; border: none; object-fit: cover; }

        /* SECTION ADMIN (Correction : Visible en bas de page) */
        .admin-section { margin-top: 50px; padding: 30px; border-top: 1px solid var(--or); background: #0a0f1a; }
        .admin-box { max-width: 400px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-gold { background: var(--or); color: black; }
        
        .hidden { display: none; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-cercle">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 0.8rem; letter-spacing: 3px;">GLOBAL INVESTISSEMENT</p>
    </header>

    <div class="social-links">
        <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne"><i class="fab fa-tiktok"></i></a>
    </div>

    <h3>NOS RÉALISATIONS</h3>
    <div id="gallery" class="gallery">
        <!-- Les photos/vidéos s'affichent ici -->
    </div>

    <!-- ZONE D'ACCÈS DIRECT (Pas de fenêtre popup qui bloque) -->
    <div class="admin-section">
        <div class="admin-box" id="login-zone">
            <h4>ESPACE GESTIONNAIRE</h4>
            <input type="password" id="pass-field" placeholder="Entrez le mot de passe">
            <button class="btn btn-gold" onclick="verifierPass()">SE CONNECTER</button>
        </div>

        <div class="admin-box hidden" id="upload-zone">
            <h4>PUBLIER UN CONTENU</h4>
            <select id="type-select">
                <option value="img">IMAGE (Lien URL)</option>
                <option value="vid">YOUTUBE (Lien URL)</option>
            </select>
            <input type="text" id="url-field" placeholder="Collez le lien ici">
            <button class="btn btn-gold" onclick="ajouterContenu()">PUBLIER MAINTENANT</button>
            <button class="btn" style="background:#333; color:white;" onclick="location.reload()">DÉCONNEXION</button>
        </div>
    </div>

    <script>
        // Initialisation Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-global-v1';
        const collection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let estConnecte = false;

        // Connexion silencieuse obligatoire
        firebase.auth().signInAnonymously();

        // Charger la galerie
        function chargerGalerie() {
            collection.orderBy('timestamp', 'desc').onSnapshot(snap => {
                const galleryDiv = document.getElementById('gallery');
                galleryDiv.innerHTML = "";
                snap.forEach(doc => {
                    const item = doc.data();
                    const card = document.createElement('div');
                    card.className = "card";
                    
                    if(item.type === 'vid') {
                        const ytId = item.url.split('v=')[1] || item.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${ytId}"></iframe>;
                    } else {
                        card.innerHTML = <img src="${item.url}" onerror="this.src='https://via.placeholder.com/400x250?text=Image+Non+Valide'">;
                    }

                    // Bouton supprimer si connecté
                    if(estConnecte) {
                        const delBtn = document.createElement('button');
                        delBtn.className = "delete-btn";
                        delBtn.innerHTML = "X";
                        delBtn.onclick = () => { if(confirm("Supprimer ?")) doc.ref.delete(); };
                        card.appendChild(delBtn);
                    }
                    
                    galleryDiv.appendChild(card);
                });
            });
        }

        // Vérifier le mot de passe
        function verifierPass() {
            const p = document.getElementById('pass-field').value;
            if(p.toUpperCase() === "LVD2024") {
                estConnecte = true;
                document.getElementById('login-zone').classList.add('hidden');
                document.getElementById('upload-zone').classList.remove('hidden');
                chargerGalerie(); // Recharger pour afficher les boutons supprimer
            } else {
                alert("Mot de passe incorrect");
            }
        }

        // Ajouter du contenu
        async function ajouterContenu() {
            const url = document.getElementById('url-field').value;
            const type = document.getElementById('type-select').value;
            if(!url) return alert("Veuillez coller un lien");

            try {
                await collection.add({
                    url: url,
                    type: type,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('url-field').value = "";
                alert("Publié !");
            } catch(e) {
                alert("Erreur de sauvegarde.");
            }
        }

        chargerGalerie();
    </script>
</body>
</html>
