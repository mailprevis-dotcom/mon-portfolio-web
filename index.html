<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --gray: #111111;
            /* Couleurs réseaux */
            --wa: #25D366; --fb: #1877F2; --ig: #E1306C; --tk: #000000; --x: #000000; --maps: #EA4335;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%); 
            color: white; 
            min-height: 100vh;
        }

        /* HEADER */
        header { padding: 60px 20px 40px; text-align: center; }
        .logo-circle { 
            width: 100px; height: 100px; background: white; border-radius: 50%; 
            margin: 0 auto 25px; display: flex; align-items: center; justify-content: center;
            border: 4px solid var(--gold); color: #333; font-weight: 900; font-size: 28px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        h1 { color: var(--gold); letter-spacing: 4px; font-size: 1.5rem; text-transform: uppercase; font-weight: 800; }
        .tagline { color: #aaa; font-size: 0.75rem; letter-spacing: 5px; margin-top: 8px; text-transform: uppercase; }

        /* SOCIAL BAR */
        .social-bar { 
            display: flex; justify-content: center; gap: 12px; padding: 20px; 
            flex-wrap: wrap; max-width: 600px; margin: 0 auto; 
        }
        .icon-box { 
            width: 45px; height: 45px; border-radius: 12px; display: flex; 
            align-items: center; justify-content: center; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: var(--gray); border: 1px solid #222;
        }
        .icon-box:hover { transform: translateY(-5px); border-color: var(--gold); }
        .icon-box svg { width: 22px; height: 22px; fill: white; }

        /* CONTENT */
        .main-content { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .section-header { 
            text-align: center; margin-bottom: 40px; position: relative;
        }
        .section-header h2 { 
            text-transform: uppercase; letter-spacing: 4px; font-size: 1.2rem;
            display: inline-block; padding-bottom: 10px;
        }
        .section-header::after {
            content: ''; display: block; width: 50px; height: 3px; 
            background: var(--gold); margin: 10px auto; border-radius: 2px;
        }

        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
        }
        .project-card { 
            background: #0f0f0f; border-radius: 15px; overflow: hidden; 
            border: 1px solid #1a1a1a; transition: 0.3s; position: relative;
        }
        .project-card:hover { border-color: #333; transform: scale(1.02); }
        .project-card img, .project-card iframe { 
            width: 100%; aspect-ratio: 16/9; display: block; border: none; object-fit: cover; 
        }

        /* ADMIN FORM */
        .admin-section { 
            margin-top: 80px; padding: 30px; background: #0a0a0a; 
            border-radius: 20px; border: 1px dashed #333; max-width: 500px; margin-left: auto; margin-right: auto;
        }
        input, select { 
            width: 100%; padding: 14px; margin-bottom: 15px; 
            background: #111; border: 1px solid #222; color: white; border-radius: 8px; 
        }
        .btn-gold { 
            background: var(--gold); color: black; border: none; padding: 15px; 
            width: 100%; font-weight: bold; cursor: pointer; border-radius: 8px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .hidden { display: none; }
        .delete-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(220, 20, 60, 0.9);
            color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;
        }

        footer { padding: 60px 20px; text-align: center; color: #444; font-size: 0.8rem; }
        .manage-link { color: #555; cursor: pointer; display: block; margin-top: 20px; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="section-header">
        <h2>RÉALISATIONS</h2>
    </div>

    <div id="gallery-grid" class="grid">
        <p style="text-align:center; grid-column:1/-1; color:#555; padding:50px;">Chargement en cours...</p>
    </div>

    <!-- ZONE ADMIN -->
    <div id="admin-panel" class="hidden">
        <div class="admin-section">
            <h3 style="text-align:center; margin-bottom:20px; color:var(--gold)">ESPACE GESTION</h3>
            <div id="auth-box">
                <input type="password" id="admin-code" placeholder="Code de sécurité">
                <button class="btn-gold" onclick="checkAuth()">ENTRER</button>
            </div>
            <div id="form-box" class="hidden">
                <select id="media-type">
                    <option value="img">IMAGE (URL)</option>
                    <option value="vid">YOUTUBE (LIEN)</option>
                </select>
                <input type="text" id="media-url" placeholder="Coller le lien ici...">
                <button class="btn-gold" onclick="publishMedia()">PUBLIER LE PROJET</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2025 LVD Global Investissement. Confidentialité assurée.</p>
    <span class="manage-link" onclick="document.getElementById('admin-panel').classList.toggle('hidden')">Configuration</span>
</footer>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = JSON.parse(__firebase_config);
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-main-final';
    
    // Chemin Firestore strict Rule 1
    const collectionRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('items');

    let isAdmin = false;

    // Auth anonyme obligatoire Rule 3
    firebase.auth().signInAnonymously().catch(e => console.error("Auth error", e));

    function checkAuth() {
        if(document.getElementById('admin-code').value === "1234") {
            isAdmin = true;
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('form-box').classList.remove('hidden');
            loadGallery(); // Rafraîchir pour voir les boutons de suppression
        } else {
            alert("Code incorrect");
        }
    }

    function loadGallery() {
        // Rule 2: Simple query sans orderBy pour éviter les erreurs d'index au début
        collectionRef.onSnapshot(snapshot => {
            const container = document.getElementById('gallery-grid');
            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#333; padding:50px;">Aucun projet affiché pour le moment.</p>';
                return;
            }

            // Trier manuellement en mémoire pour éviter le bug d'indexation Firebase
            const docs = [];
            snapshot.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
            docs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            container.innerHTML = "";
            docs.forEach(data => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                if(data.type === 'vid') {
                    const vidId = data.url.includes('v=') ? data.url.split('v=')[1].split('&')[0] : data.url.split('/').pop();
                    card.innerHTML = <iframe src="https://www.youtube.com/embed/${vidId}" allowfullscreen></iframe>;
                } else {
                    card.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/800x450/050505/D4AF37?text=Image+Indisponible'">;
                }

                if(isAdmin) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerText = "SUPPRIMER";
                    delBtn.onclick = () => { if(confirm("Supprimer ce projet ?")) deleteProject(data.id); };
                    card.appendChild(delBtn);
                }

                container.appendChild(card);
            });
        }, error => {
            console.error(error);
            document.getElementById('gallery-grid').innerHTML = '<p style="color:#666; text-align:center; grid-column:1/-1;">Synchronisation avec le Cloud LVD...</p>';
        });
    }

    async function publishMedia() {
        const url = document.getElementById('media-url').value;
        const type = document.getElementById('media-type').value;
        if(!url) return alert("Veuillez entrer une URL");

        try {
            await collectionRef.add({
                url: url,
                type: type,
                createdAt: Date.now()
            });
            document.getElementById('media-url').value = "";
            alert("Projet publié avec succès !");
        } catch(e) {
            alert("Erreur de publication");
        }
    }

    async function deleteProject(id) {
        try {
            await collectionRef.doc(id).delete();
        } catch(e) {
            alert("Erreur de suppression");
        }
    }

    // Lancement au démarrage
    loadGallery();
</script>

</body>
</html>
