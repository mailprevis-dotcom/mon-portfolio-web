<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    
    <!-- Scripts de base -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root { --or: #FFD700; --fond: #05080a; --carte: #111827; }
        body { background: var(--fond); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        
        /* Header */
        header { padding: 30px 15px; border-bottom: 1px solid #1e293b; }
        .logo-lvd { width: 60px; height: 60px; background: white; color: black; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--or); }
        h1 { color: var(--or); font-size: 1rem; letter-spacing: 1px; margin: 0; }

        /* RÉSEAUX SOCIAUX (TOUS RÉTABLIS) */
        .social-box { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 20px; }
        .social-box a { color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; width: 60px; }
        .social-box i { font-size: 1.5rem; margin-bottom: 5px; }
        .fa-whatsapp { color: #25D366; } .fa-instagram { color: #E4405F; } .fa-facebook { color: #1877F2; }
        .fa-tiktok { color: #fff; } .fa-x-twitter { color: #fff; } .fa-map-marker-alt { color: #EA4335; }
        .g-color { background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .social-box span { font-size: 7px; font-weight: bold; }

        /* Galerie */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 15px; }
        .item { background: var(--carte); border-radius: 8px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .item img, .item iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

        /* ZONE GESTION (TOUT EN BAS) */
        .admin-area { margin: 50px 0; padding: 30px; border-top: 1px solid #1e293b; background: #080c14; }
        .input-style { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: white; }
        .btn-post { background: var(--or); color: black; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; }
        
        .hidden { display: none; }
        .delete { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-lvd">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 0.6rem; opacity: 0.5; letter-spacing: 3px;">GLOBAL INVESTISSEMENT</p>
    </header>

    <div class="social-box">
        <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i><span>WHATSAPP</span></a>
        <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i><span>INSTAGRAM</span></a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i><span>FACEBOOK</span></a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne"><i class="fab fa-tiktok"></i><span>TIKTOK</span></a>
        <a href="https://x.com/LDyonisienne"><i class="fab fa-x-twitter"></i><span>X</span></a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC"><i class="fas fa-map-marker-alt"></i><span>ADRESSE</span></a>
        <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC"><i class="fab fa-google g-color"></i><span>GOOGLE</span></a>
    </div>

    <h2 style="font-weight: 300; font-size: 1rem; letter-spacing: 2px;">RÉALISATIONS</h2>
    <div id="gallery-container" class="grid">
        <p style="opacity:0.2">Chargement du contenu...</p>
    </div>

    <div class="admin-area">
        <div id="login-form">
            <p style="font-size: 10px; opacity: 0.4;">ESPACE GESTION</p>
            <input type="password" id="pass" class="input-style" placeholder="Tapez le code ici..." oninput="autoCheck()">
            <p id="err" style="color:red; font-size:10px; display:none;">Code incorrect</p>
        </div>

        <div id="upload-form" class="hidden">
            <h4 style="color:var(--or)">PUBLIER</h4>
            <select id="m-type" class="input-style">
                <option value="img">IMAGE</option>
                <option value="vid">YOUTUBE</option>
            </select>
            <input type="text" id="m-url" class="input-style" placeholder="Collez le lien ici">
            <button class="btn-post" onclick="send()">ENREGISTRER</button>
            <br><br>
            <button onclick="location.reload()" style="background:none; border:none; color:gray; font-size:10px; cursor:pointer;">DÉCONNEXION</button>
        </div>
    </div>

    <script>
        // Initialisation Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v1';
        const gallery = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('items');

        let isLogged = false;

        firebase.auth().signInAnonymously();

        // Vérification automatique sans bouton
        function autoCheck() {
            const val = document.getElementById('pass').value.toUpperCase();
            if(val === "LVD2024") {
                isLogged = true;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('upload-form').classList.remove('hidden');
                render();
            } else if (val.length >= 7) {
                document.getElementById('err').style.display = "block";
            }
        }

        function render() {
            gallery.orderBy('date', 'desc').onSnapshot(snap => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const div = document.createElement('div');
                    div.className = "item";
                    
                    if(d.type === 'vid') {
                        const id = d.url.split('v=')[1] || d.url.split('/').pop();
                        div.innerHTML = <iframe src="https://www.youtube.com/embed/${id}"></iframe>;
                    } else {
                        div.innerHTML = <img src="${d.url}">;
                    }

                    if(isLogged) {
                        const b = document.createElement('button');
                        b.className = "delete"; b.innerText = "SUPPRIMER";
                        b.onclick = () => { if(confirm("Effacer ?")) doc.ref.delete(); };
                        div.appendChild(b);
                    }
                    container.appendChild(div);
                });
            });
        }

        async function send() {
            const u = document.getElementById('m-url').value;
            const t = document.getElementById('m-type').value;
            if(!u) return;
            try {
                await gallery.add({ url: u, type: t, date: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('m-url').value = "";
                alert("Publié !");
            } catch(e) { alert("Erreur"); }
        }

        render();
    </script>
</body>
</html>
