<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --or: #FFD700;
            --vert: #00FF7F;
            --fond: #05080a;
            --carte: #111827;
            --texte: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--fond); 
            color: var(--texte);
            overflow-x: hidden;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f172a, var(--fond));
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .logo-box {
            width: 85px;
            height: 85px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--or);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .logo-box span { color: #000; font-weight: bold; font-size: 24px; }

        h1 { font-size: 1.8rem; color: var(--or); text-transform: uppercase; letter-spacing: 4px; margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; opacity: 0.7; letter-spacing: 5px; text-transform: uppercase; }

        .intro { padding: 40px 10px; text-align: center; max-width: 1000px; margin: 0 auto; }
        .line { width: 70px; height: 3px; background: var(--vert); margin: 25px auto; }

        /* BARRE DE RÉSEAUX SOCIAUX DÉTAILLÉE */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin: 20px 0 50px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-link:hover { transform: translateY(-5px); }
        .social-link i { font-size: 2rem; margin-bottom: 10px; }
        .social-link span { font-size: 10px; text-transform: uppercase; color: #888; font-weight: bold; }

        /* Couleurs et Logos Spécifiques */
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }
        .fa-tiktok { color: #FFFFFF; }
        .fa-x-twitter { color: #FFFFFF; } /* Nouveau logo X */
        .fa-map-marker-alt { color: #EA4335; } /* Maps Red */

        /* Logo Google Multicolore */
        .google-icon {
            font-weight: 900;
            font-style: normal;
            background: linear-gradient(to right, #4285F4 25%, #EA4335 25% 50%, #FBBC05 50% 75%, #34A853 75%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
        }

        /* Galerie */
        .gallery-container { padding: 0 15px 120px; max-width: 1200px; margin: 0 auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }
        .card {
            background: var(--carte);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
            transition: transform 0.4s;
        }
        .card:hover { transform: scale(1.02); }
        .card img, .card iframe {
            width: 100%;
            display: block;
            aspect-ratio: 16/10;
            object-fit: cover;
            border: none;
        }

        /* Footer & Admin */
        footer {
            padding: 80px 20px;
            text-align: center;
            background: #000;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .admin-key {
            display: inline-block;
            margin-top: 40px;
            font-size: 8px;
            color: #111; /* Presque invisible sur fond noir */
            text-decoration: none;
            cursor: pointer;
        }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 10000;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #0d1117;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--or);
            text-align: center;
        }
        input, select {
            width: 100%; padding: 15px; margin: 12px 0;
            border-radius: 10px; border: 1px solid #333;
            background: #000; color: #fff; font-size: 16px;
        }
        .btn {
            width: 100%; padding: 16px; border-radius: 10px; border: none;
            font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-gold { background: var(--or); color: #000; }
        .btn-green { background: var(--vert); color: #000; }
        .btn-off { background: none; color: #444; margin-top: 20px; font-size: 12px; }

        .btn-del {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,0,0,0.9);
            color: white; border: none; padding: 12px; border-radius: 50%;
            cursor: pointer; z-index: 10;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.3rem; }
            .grid { grid-template-columns: 1fr; }
            .social-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box"><span>LVD</span></div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p class="subtitle">Global Investissement</p>
    </header>

    <section class="intro">
        <h2>Espace d'Excellence</h2>
        <div class="line"></div>
        
        <!-- RÉSEAUX SOCIAUX MIS À JOUR -->
        <div class="social-grid">
            <a href="https://wa.me/2693246465" class="social-link" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="https://www.instagram.com/la_villa_dionysienne" class="social-link" title="Instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="social-link" title="Facebook">
                <i class="fab fa-facebook"></i>
                <span>Facebook</span>
            </a>
            <a href="https://www.tiktok.com/@la_villa_dionysienne" class="social-link" title="TikTok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="https://twitter.com/la_villa_dionysienne" class="social-link" title="X (Twitter)">
                <i class="fab fa-x-twitter"></i>
                <span>X / Twitter</span>
            </a>
            <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="social-link" title="Localisation">
                <i class="fas fa-map-marker-alt"></i>
                <span>Adresse</span>
            </a>
            <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC" class="social-link" title="Google Search">
                <i class="fab fa-google google-icon"></i>
                <span>Google</span>
            </a>
        </div>
    </section>

    <div class="gallery-container">
        <div id="gallery-grid" class="grid">
            <!-- Contenu dynamique -->
        </div>
    </div>

    <footer>
        <p style="opacity: 0.3; font-size: 11px;">&copy; 2025 LVD GLOBAL INVESTISSEMENT - Prestige & Expertise</p>
        <!-- Gestion cachée -->
        <a class="admin-key" onclick="openP('modal-auth')">System</a>
    </footer>

    <!-- Auth -->
    <div id="modal-auth" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--or); margin-bottom:20px;">AUTHENTIFICATION</h3>
            <input type="password" id="p-input" placeholder="Code secret">
            <button class="btn btn-gold" onclick="auth()">ENTRER</button>
            <button class="btn btn-off" onclick="closeP('modal-auth')">RETOUR</button>
        </div>
    </div>

    <!-- Admin -->
    <div id="modal-dash" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--vert); margin-bottom:20px;">PUBLIER</h3>
            <select id="m-type">
                <option value="img">IMAGE (URL)</option>
                <option value="vid">YOUTUBE (URL)</option>
            </select>
            <input type="url" id="m-url" placeholder="Lien du contenu">
            <button class="btn btn-green" onclick="pub()">PUBLIER</button>
            <button class="btn btn-off" onclick="location.reload()">DÉCONNEXION</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('lvd_vFinal_db') || '[]');
        let authOk = false;

        function openP(id) { document.getElementById(id).style.display = 'flex'; }
        function closeP(id) { document.getElementById(id).style.display = 'none'; }

        function auth() {
            if(document.getElementById('p-input').value.toUpperCase() === "LVD2024") {
                authOk = true;
                closeP('modal-auth');
                openP('modal-dash');
                draw();
            } else { alert("Accès non autorisé."); }
        }

        function draw() {
            const g = document.getElementById('gallery-grid');
            if(db.length === 0) {
                g.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:100px; opacity:0.1;">Aucune publication...</p>';
                return;
            }
            g.innerHTML = db.map((it, i) => `
                <div class="card">
                    ${it.type === 'vid' ? 
                        <iframe src="https://www.youtube.com/embed/${getV(it.url)}" allowfullscreen></iframe> : 
                        <img src="${it.url}" onerror="this.src='https://placehold.co/600x400/111827/ffffff?text=LVD+Global'">
                    }
                    ${authOk ? <button class="btn-del" onclick="del(${i})"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        function getV(url) {
            const r = /^.(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]).*/;
            const m = url.match(r);
            return (m && m[2].length === 11) ? m[2] : '';
        }

        function pub() {
            const u = document.getElementById('m-url').value.trim();
            const t = document.getElementById('m-type').value;
            if(!u) return;
            db.unshift({ url: u, type: t });
            localStorage.setItem('lvd_vFinal_db', JSON.stringify(db));
            document.getElementById('m-url').value = '';
            draw();
            alert("Publié avec succès.");
        }

        function del(i) {
            if(confirm("Confirmer la suppression ?")) {
                db.splice(i, 1);
                localStorage.setItem('lvd_vFinal_db', JSON.stringify(db));
                draw();
            }
        }

        draw();
    </script>
</body>
</html>
