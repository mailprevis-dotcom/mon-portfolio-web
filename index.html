<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        :root {
            --couleur-principale: #FFD700; 
            --couleur-accent-secondaire: #00FF7F; 
            --couleur-fond-principal: #1f2a38; 
            --couleur-fond-secondaire: #2c3e50; 
            --couleur-texte: #ecf0f1; 
            --couleur-fond-hero: #111827; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--couleur-fond-principal);
            color: var(--couleur-texte);
            line-height: 1.6;
        }
        
        .header { 
            background-color: var(--couleur-fond-secondaire); 
            padding: 20px 0; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); 
        }
        .header h1 { 
            text-align: center; font-size: 1.1rem; color: var(--couleur-principale); 
            text-transform: uppercase; letter-spacing: 2px; padding: 0 10px;
        }

        .logo-circle { 
            height: 70px; width: 70px; background: white; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: black; font-weight: bold; border: 3px solid var(--couleur-principale);
        }

        section { padding: 40px 5%; text-align: center; }
        section h2 { 
            font-size: 1.6rem; color: var(--couleur-principale); margin-bottom: 30px; 
            text-transform: uppercase; border-bottom: 2px solid var(--couleur-accent-secondaire); 
            display: inline-block; 
        }

        .hero { background-color: var(--couleur-fond-hero); min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        
        .stats-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid var(--couleur-accent-secondaire); min-width: 90px; }
        .stat-number { display: block; font-size: 1.3rem; font-weight: bold; color: var(--couleur-principale); }

        .social-links { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 500px; }
        .social-links a { font-size: 2rem; text-decoration: none; transition: 0.3s; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.05); }
        .social-links a:hover { transform: scale(1.2); background: rgba(255,255,255,0.15); }
        
        /* Couleurs des icônes */
        .fa-whatsapp { color: #25D366; } 
        .fa-instagram { color: #E4405F; } 
        .fa-facebook { color: #1877F2; } 
        .fa-x-twitter { color: white; }
        .fa-tiktok { color: #ff0050; }
        .fa-threads { color: #ffffff; }
        .fa-location-dot { color: #EA4335; }

        /* GALERIE */
        #cont-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .photo-card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; position: relative; }
        .photo-card img, .photo-card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; object-fit: cover; }

        /* ADMIN */
        .admin-section { background: #000; padding: 30px; border-radius: 15px; margin-top: 40px; border: 1px dashed var(--couleur-principale); }
        .input-lvd { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        .btn-lvd { background: var(--couleur-principale); color: black; font-weight: bold; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10px; font-weight: bold; }

        .footer { background: #111; padding: 20px; color: #666; font-size: 11px; margin-top: 40px; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-circle" onclick="toggleAdminView()">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
    </header>

    <section class="hero">
        <h2 style="border:none">NOTRE PARCOURS</h2>
        <div class="stats-container">
            <div class="stat-item"><span class="stat-number">150+</span><span>Photos</span></div>
            <div class="stat-item"><span class="stat-number">25</span><span>Vidéos</span></div>
            <div class="stat-item"><span class="stat-number">5k+</span><span>Abonnés</span></div>
        </div>
        
        <div class="social-links">
            <a href="https://wa.me/2693246465" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/" title="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://www.tiktok.com/@la_villa_dionysienne" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://x.com/LDyonisienne" title="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.threads.net/@la_villa_dionysienne" title="Threads"><i class="fab fa-threads"></i></a>
            <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" title="Nous trouver"><i class="fa-solid fa-location-dot"></i></a>
        </div>
    </section>

    <section id="galerie">
        <h2>Nos Projets en Direct</h2>
        <div id="cont-photos">
            <p style="opacity: 0.3;">Chargement de la galerie...</p>
        </div>

        <div id="admin-ui" class="admin-section hidden">
            <div id="login-form">
                <p style="margin-bottom:10px; font-size:12px; color:var(--couleur-principale)">ESPACE GESTIONNAIRE</p>
                <input type="password" id="pass-val" placeholder="Entrez le mot de passe" class="input-lvd">
                <br>
                <button onclick="verifier()" class="btn-lvd">Vérifier</button>
            </div>

            <div id="upload-form" class="hidden">
                <h3 style="color:var(--couleur-principale)">PUBLIER</h3>
                <select id="m-type" class="input-lvd">
                    <option value="image">IMAGE</option>
                    <option value="video">VIDÉO YOUTUBE</option>
                </select>
                <input type="text" id="m-url" placeholder="Collez le lien ici" class="input-lvd">
                <br>
                <button onclick="publier()" class="btn-lvd" style="background:var(--couleur-accent-secondaire)">Mettre en ligne</button>
                <p style="margin-top:15px;"><button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; text-decoration:underline;">Déconnexion</button></p>
            </div>
        </div>
    </section>

    <footer class="footer">
        &copy; 2025 LA VILLA DIONYSIENNE MC GLOBAL INVESTISSEMENT.
    </footer>

    <!-- Scripts Firebase SDK v11 -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

    <script>
        // Configuration Auto
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v3-final';
        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let estAdmin = false;

        // Connexion anonyme immédiate
        firebase.auth().signInAnonymously().then(() => {
            charger();
        }).catch(err => console.error("Auth error:", err));

        function toggleAdminView() {
            const ui = document.getElementById('admin-ui');
            ui.classList.toggle('hidden');
            if(!ui.classList.contains('hidden')) {
                ui.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function verifier() {
            const p = document.getElementById('pass-val').value.trim();
            if(p.toUpperCase() === "LVD2024") {
                estAdmin = true;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('upload-form').classList.remove('hidden');
                alert("Accès autorisé !");
                charger(); 
            } else {
                alert("Mot de passe incorrect.");
            }
        }

        function charger() {
            col.orderBy('date', 'desc').onSnapshot(snap => {
                const cont = document.getElementById('cont-photos');
                cont.innerHTML = "";
                if(snap.empty) cont.innerHTML = "<p style='opacity:0.2'>Aucun contenu à afficher.</p>";
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = "photo-card";
                    
                    if(data.type === 'video') {
                        // Extraction ID Youtube simple
                        let id = data.url.includes('v=') ? data.url.split('v=')[1].split('&')[0] : data.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>;
                    } else {
                        card.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/400x300?text=Lien+incorrect'">;
                    }

                    if(estAdmin) {
                        const btn = document.createElement('button');
                        btn.className = "delete-btn";
                        btn.innerText = "SUPPRIMER";
                        btn.onclick = () => { if(confirm("Supprimer ce contenu ?")) doc.ref.delete(); };
                        card.appendChild(btn);
                    }
                    cont.appendChild(card);
                });
            }, (error) => {
                console.error("Erreur lecture:", error);
            });
        }

        async function publier() {
            const url = document.getElementById('m-url').value.trim();
            const type = document.getElementById('m-type').value;
            if(!url) return alert("Veuillez coller un lien.");
            
            try {
                await col.add({
                    url: url,
                    type: type,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('m-url').value = "";
                alert("Publié avec succès !");
            } catch(e) {
                console.error("Erreur écriture:", e);
                alert("Erreur de publication. Vérifiez la connexion.");
            }
        }
    </script>
</body>
</html>
