    <style>
        :root {
            --or: #FFD700; 
            --vert: #00FF7F; 
            --fond-bleu: #1f2a38; 
            --fond-header: #2c3e50; 
            --blanc: #ecf0f1; 
            --noir-profond: #111827; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fond-bleu);
            color: var(--blanc);
            line-height: 1.6;
        }
        
        header { 
            background-color: var(--fond-header); 
            padding: 25px 20px; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            text-align: center;
        }

        .logo-lvd { 
            height: 70px; width: 70px; background: white; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #000; font-weight: 900; border: 3px solid var(--or);
        }

        h1 { font-size: 1rem; color: var(--or); text-transform: uppercase; letter-spacing: 2px; }

        .hero-section { background-color: var(--noir-profond); padding: 40px 20px; text-align: center; border-bottom: 3px solid var(--vert); }
        
        .stats { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid var(--vert); min-width: 90px; }
        .stat-num { display: block; font-size: 1.2rem; font-weight: bold; color: var(--or); }

        .social-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px auto; max-width: 600px; }
        .social-bar a { 
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; 
            border-radius: 10px; background: rgba(255,255,255,0.1); transition: 0.3s;
        }
        .social-bar a:hover { transform: translateY(-3px); background: rgba(255,255,255,0.2); }
        .social-bar svg { width: 24px; height: 24px; fill: white; }

        section { padding: 40px 20px; max-width: 1200px; margin: 0 auto; text-align: center; }
        h2 { color: var(--or); text-transform: uppercase; margin-bottom: 25px; font-size: 1.3rem; }

        .grid-galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .item-card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; position: relative; }
        .item-card img, .item-card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; object-fit: cover; }

        /* ADMINISTRATION DISCRÈTE */
        .admin-panel { margin: 20px auto; padding: 20px; background: #000; border-radius: 15px; border: 1px dashed var(--or); display: none; max-width: 400px; }
        .field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 16px; }
        .btn-action { background: var(--or); color: #000; font-weight: bold; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .hidden { display: none; }
        .btn-suppr { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.7); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; }

        footer { padding: 40px 20px; color: #444; font-size: 11px; text-align: center; position: relative; }
        /* LE POINT SECRET */
        .secret-dot { position: absolute; bottom: 5px; right: 5px; width: 10px; height: 10px; cursor: pointer; opacity: 0.1; }
    </style>
</head>

    <section id="galerie">
        <h2>NOS RÉALISATIONS</h2>
        <div id="gal-cont" class="grid-galerie">
            <p style="opacity: 0.2;">Chargement...</p>
        </div>

        <div id="admin-ui" class="admin-panel">
            <div id="login">
                <p style="color:var(--or); margin-bottom:10px;">ACCÈS GESTION</p>
                <input type="password" id="pass" placeholder="Code secret" class="field">
                <button onclick="checkAdmin()" class="btn-action">Entrer</button>
            </div>
            <div id="upload" class="hidden">
                <h3 style="color:var(--or); margin-bottom:10px;">AJOUTER</h3>
                <select id="type" class="field">
                    <option value="image">IMAGE</option>
                    <option value="video">YOUTUBE</option>
                </select>
                <input type="text" id="url" placeholder="Lien (URL)" class="field">
                <button onclick="addMe()" class="btn-action" style="background:var(--vert)">Publier</button>
                <p onclick="location.reload()" style="color:gray; cursor:pointer; margin-top:15px; font-size:12px;">Déconnexion</p>
            </div>
        </div>

    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

    <script>
        const cfg = JSON.parse(__firebase_config);
        firebase.initializeApp(cfg);
        const db = firebase.firestore();
        const aId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v4-secret';
        const gal = db.collection('artifacts').doc(aId).collection('public').doc('data').collection('gallery');

        let isMe = false;
        firebase.auth().signInAnonymously().then(() => { refresh(); });

        function showAdmin() {
            document.getElementById('admin-ui').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function checkAdmin() {
            if(document.getElementById('pass').value.toUpperCase() === "LVD2024") {
                isMe = true;
                document.getElementById('login').classList.add('hidden');
                document.getElementById('upload').classList.remove('hidden');
                refresh();
            }
        }

        function refresh() {
            gal.orderBy('date', 'desc').onSnapshot(s => {
                const c = document.getElementById('gal-cont');
                c.innerHTML = s.empty ? "<p style='opacity:0.2'>Rien ici.</p>" : "";
                s.forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = "item-card";
                    if(data.type === 'video') {
                        let id = data.url.includes('v=') ? data.url.split('v=')[1].split('&')[0] : data.url.split('/').pop();
                        el.innerHTML = <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>;
                    } else {
                        el.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/400x250?text=IMG'">;
                    }
                    if(isMe) {
                        const b = document.createElement('button'); b.className = "btn-suppr"; b.innerText = "X";
                        b.onclick = () => { if(confirm("Supprimer ?")) d.ref.delete(); };
                        el.appendChild(b);
                    }
                    c.appendChild(el);
                });
            });
        }

        async function addMe() {
            const u = document.getElementById('url').value.trim();
            if(!u) return;
            await gal.add({ url: u, type: document.getElementById('type').value, date: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('url').value = "";
        }
    </script>
