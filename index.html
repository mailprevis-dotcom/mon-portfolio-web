<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD GLOBAL INVESTISSEMENT</title>
    
    <!-- Scripts Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    
    <!-- Font Awesome pour les logos réseaux sociaux -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body { 
            background-color: #050a0f; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            text-align: center; 
            padding-bottom: 50px;
        }
        
        .header { padding: 30px; border-bottom: 1px solid #1a2635; }
        .logo-circle { 
            width: 80px; height: 80px; background: white; color: black; 
            border-radius: 50%; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 3px solid #FFD700; font-size: 20px;
        }
        h1 { color: #FFD700; font-size: 1.2rem; margin: 0; letter-spacing: 2px; }

        /* RÉSEAUX SOCIAUX - GRANDS ET VISIBLES */
        .social-container { 
            display: flex; justify-content: center; gap: 20px; 
            flex-wrap: wrap; padding: 25px; max-width: 500px; margin: 0 auto;
        }
        .social-link { 
            text-decoration: none; color: white; 
            display: flex; flex-direction: column; align-items: center; width: 70px;
        }
        .social-link i { font-size: 30px; margin-bottom: 8px; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }
        .fa-tiktok { color: white; }
        .fa-x-twitter { color: white; }
        .fa-map-marker-alt { color: #EA4335; }
        .fa-google { color: #FBBC05; }
        .social-link span { font-size: 9px; font-weight: bold; text-transform: uppercase; }

        /* GALERIE */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #111b27; border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }

        /* ZONE ADMIN - TRÈS SIMPLE */
        .admin-zone { 
            background: #0a1219; border-top: 2px solid #FFD700; 
            padding: 40px 20px; margin-top: 50px;
        }
        .input-field { 
            width: 100%; max-width: 300px; padding: 15px; 
            margin: 10px 0; border-radius: 8px; border: 1px solid #333; 
            background: #000; color: white; font-size: 16px;
        }
        .login-btn { 
            background: #FFD700; color: black; border: none; 
            padding: 15px 30px; border-radius: 8px; font-weight: bold; 
            cursor: pointer; width: 100%; max-width: 300px; font-size: 16px;
        }
        .hidden { display: none; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-circle">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 10px; opacity: 0.6; letter-spacing: 4px;">GLOBAL INVESTISSEMENT</p>
    </div>

    <!-- RÉSEAUX SOCIAUX -->
    <div class="social-container">
        <a href="https://wa.me/2693246465" class="social-link"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
        <a href="https://www.instagram.com/la_villa_dionysienne" class="social-link"><i class="fab fa-instagram"></i><span>Instagram</span></a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="social-link"><i class="fab fa-facebook"></i><span>Facebook</span></a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne" class="social-link"><i class="fab fa-tiktok"></i><span>TikTok</span></a>
        <a href="https://x.com/LDyonisienne" class="social-link"><i class="fab fa-x-twitter"></i><span>X</span></a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="social-link"><i class="fas fa-map-marker-alt"></i><span>Adresse</span></a>
        <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC" class="social-link"><i class="fab fa-google"></i><span>Google</span></a>
    </div>

    <h2 style="font-weight: normal; letter-spacing: 2px;">NOS RÉALISATIONS</h2>
    
    <div id="gallery" class="gallery">
        <!-- Les photos apparaîtront ici -->
        <p style="opacity:0.3">Chargement du portfolio...</p>
    </div>

    <!-- ZONE D'ADMINISTRATION -->
    <div class="admin-zone">
        <!-- Étape 1 : Connexion -->
        <div id="login-box">
            <h3>ACCÈS GESTION</h3>
            <input type="password" id="pass" class="input-field" placeholder="Entrez le mot de passe">
            <button class="login-btn" onclick="connexion()">SE CONNECTER</button>
        </div>

        <!-- Étape 2 : Publication (Caché au début) -->
        <div id="upload-box" class="hidden">
            <h3 style="color:#FFD700">PUBLIER UN PROJET</h3>
            <select id="type" class="input-field">
                <option value="img">IMAGE (Lien URL)</option>
                <option value="vid">VIDÉO YOUTUBE (Lien URL)</option>
            </select>
            <input type="text" id="url" class="input-field" placeholder="Collez le lien ici">
            <button class="login-btn" onclick="publier()">METTRE EN LIGNE</button>
            <p><button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; font-size:12px;">Déconnexion</button></p>
        </div>
    </div>

    <script>
        // Configuration Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-global-final';
        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let logged = false;

        // Connexion anonyme pour les droits de lecture/écriture
        firebase.auth().signInAnonymously();

        function connexion() {
            const mdp = document.getElementById('pass').value;
            if(mdp.toUpperCase() === "LVD2024") {
                logged = true;
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('upload-box').classList.remove('hidden');
                chargerImages(); // Rafraîchir pour voir les boutons supprimer
            } else {
                alert("Mot de passe incorrect");
            }
        }

        function chargerImages() {
            col.orderBy('date', 'desc').onSnapshot(snap => {
                const container = document.getElementById('gallery');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = "card";
                    
                    if(data.type === 'vid') {
                        // Extraire l'ID Youtube (fonctionne avec les liens courts et longs)
                        const id = data.url.split('v=')[1] || data.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>;
                    } else {
                        card.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/600x400/111b27/FFFFFF?text=Lien+image+invalide'">;
                    }

                    if(logged) {
                        const btn = document.createElement('button');
                        btn.className = "delete-btn";
                        btn.innerText = "Supprimer";
                        btn.onclick = () => { if(confirm("Effacer ?")) doc.ref.delete(); };
                        card.appendChild(btn);
                    }
                    container.appendChild(card);
                });
            });
        }

        async function publier() {
            const url = document.getElementById('url').value;
            const type = document.getElementById('type').value;
            if(!url) return alert("Veuillez mettre un lien");

            try {
                await col.add({
                    url: url,
                    type: type,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('url').value = "";
                alert("Réussi ! Votre projet est en ligne.");
            } catch(e) {
                alert("Erreur lors de l'enregistrement.");
            }
        }

        // Démarrage
        chargerImages();
    </script>

</body>
</html>
