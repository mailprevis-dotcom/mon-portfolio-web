<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    <style>
        :root {
            --gold: #FFD700;
            --dark-blue: #0a192f;
            --light-blue: #172a45;
            --white: #e6f1ff;
            --green-accent: #64ffda;
            
            /* Couleurs Réseaux Sociaux */
            --whatsapp: #25D366;
            --facebook: #1877F2;
            --instagram: #E4405F;
            --tiktok: #000000;
            --x-twitter: #000000;
            --google: #4285F4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

        body {
            background-color: var(--dark-blue);
            color: var(--white);
            line-height: 1.6;
        }

        header {
            background: var(--light-blue);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        /* LOGO CENTRAL */
        .logo-wrapper {
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 4px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo-text { color: #000; font-weight: 900; font-size: 28px; }

        h1 { font-size: 1.4rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
        .tagline { color: var(--green-accent); font-size: 0.85rem; letter-spacing: 3px; font-weight: bold; margin-top: 5px; }

        /* BARRE SOCIALE COLOREE */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 25px 10px;
            background: rgba(0,0,0,0.2);
        }
        .social-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-box:hover { transform: scale(1.1); }
        .social-box svg { width: 24px; height: 24px; fill: white; }

        /* Styles spécifiques par couleur */
        .wa { background-color: var(--whatsapp); box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .fb { background-color: var(--facebook); box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3); }
        .ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); box-shadow: 0 4px 10px rgba(228, 64, 95, 0.3); }
        .tk { background-color: var(--tiktok); border: 1px solid #333; }
        .xt { background-color: var(--x-twitter); border: 1px solid #333; }
        .gg { background-color: var(--google); box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3); }

        /* SECTION RÉALISATIONS */
        section { padding: 50px 15px; max-width: 1200px; margin: 0 auto; text-align: center; }
        h2 { border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 8px; margin-bottom: 40px; }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .media-card {
            background: var(--light-blue);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .media-card img, .media-card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }

        /* ZONE GESTION */
        .admin-section {
            margin-top: 40px;
            padding: 25px;
            background: #000;
            border-radius: 15px;
            border: 1px dashed #444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background: #111;
            color: white;
        }
        .btn-gold {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .hidden { display: none; }
        footer { padding: 50px; text-align: center; font-size: 0.8rem; opacity: 0.5; }
        .secret-trigger { cursor: pointer; color: transparent; user-select: none; }
    </style>
</head>

<section>
    <h2>NOS RÉALISATIONS</h2>
    <div id="gallery-grid" class="portfolio-grid">
        <p style="grid-column: 1/-1; opacity:0.6; padding: 40px;">Découvrez nos projets en cours de réalisation...</p>
    </div>

    <!-- ZONE SECRÈTE DE GESTION -->
    <div id="admin-panel" class="admin-section hidden">
        <div id="login-box">
            <h3>ACCÈS PRIVÉ</h3>
            <input type="password" id="pass-field" placeholder="Code de sécurité">
            <button class="btn-gold" onclick="tryLogin()">Valider</button>
        </div>
        <div id="manage-box" class="hidden">
            <h3>PUBLIER UN CONTENU</h3>
            <select id="pub-type">
                <option value="image">Image (URL)</option>
                <option value="video">Vidéo (Youtube)</option>
            </select>
            <input type="text" id="pub-url" placeholder="Lien vers le média">
            <button class="btn-gold" onclick="doUpload()">Mettre à jour la galerie</button>
        </div>
    </div>
</section>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

<script>
    const config = JSON.parse(__firebase_config);
    firebase.initializeApp(config);
    const db = firebase.firestore();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v5-final';
    const collection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

    let adminActive = false;

    firebase.auth().signInAnonymously();

    function toggleAdmin() {
        document.getElementById('admin-panel').classList.toggle('hidden');
    }

    function tryLogin() {
        if(document.getElementById('pass-field').value === "1234") {
            adminActive = true;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('manage-box').classList.remove('hidden');
            renderGallery();
        } else { alert("Accès refusé"); }
    }

    function renderGallery() {
        collection.orderBy('ts', 'desc').onSnapshot(snap => {
            const grid = document.getElementById('gallery-grid');
            if(snap.empty) {
                grid.innerHTML = '<p style="grid-column: 1/-1; opacity:0.6; padding: 40px;">Bienvenue. Utilisez le panneau de gestion pour ajouter vos photos.</p>';
                return;
            }
            grid.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'media-card';
                
                if(item.type === 'video') {
                    let id = item.url.includes('v=') ? item.url.split('v=')[1].split('&')[0] : item.url.split('/').pop();
                    card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>;
                } else {
                    card.innerHTML = <img src="${item.url}" onerror="this.src='https://placehold.co/600x400/172a45/FFD700?text=Image+Non+Trouvée'">;
                }

                if(adminActive) {
                    const del = document.createElement('button');
                    del.className = 'btn-delete';
                    del.innerText = 'Supprimer';
                    del.onclick = () => { if(confirm('Supprimer ce projet ?')) doc.ref.delete(); };
                    card.appendChild(del);
                }
                grid.appendChild(card);
            });
        });
    }

    async function doUpload() {
        const url = document.getElementById('pub-url').value;
        const type = document.getElementById('pub-type').value;
        if(!url) return;
        await collection.add({ url, type, ts: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('pub-url').value = "";
    }

    renderGallery();
</script>
