<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        :root {
            --couleur-principale: #FFD700; 
            --couleur-accent-secondaire: #00FF7F; 
            --couleur-fond-principal: #1f2a38; 
            --couleur-fond-secondaire: #2c3e50; 
            --couleur-texte: #ecf0f1; 
            --couleur-fond-hero: #111827; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--couleur-fond-principal);
            color: var(--couleur-texte);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* HEADER */
        .header { 
            background-color: var(--couleur-fond-secondaire); 
            padding: 20px 0; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); 
            text-align: center;
        }
        .logo-placeholder { 
            height: 70px; width: 70px; 
            background-color: #fff; 
            border-radius: 50%; 
            margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--couleur-principale); font-weight: bold;
            border: 2px solid var(--couleur-principale);
        }
        .header h1 { 
            font-size: 1.1rem; 
            color: var(--couleur-principale); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 0 15px;
        }

        /* HERO SECTION */
        .hero { 
            padding: 60px 20px;
            text-align: center; 
            background-color: var(--couleur-fond-hero); 
            border-bottom: 5px solid var(--couleur-accent-secondaire);
        }
        .hero-title { font-size: 1.8rem; color: var(--couleur-principale); text-transform: uppercase; margin-bottom: 20px; }
        
        .stats-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 30px auto; max-width: 500px; }
        .stat-item { 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; 
            border: 1px solid var(--couleur-accent-secondaire);
        }
        .stat-number { display: block; font-size: 1.6rem; font-weight: bold; color: var(--couleur-principale); }

        .social-hero-links { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .social-hero-links a { font-size: 2.2rem; text-decoration: none; transition: 0.3s; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

        /* GALERIE CLOUD */
        .galerie-cloud { padding: 50px 20px; background-color: #1a222c; text-align: center; }
        .galerie-cloud h2 { color: var(--couleur-principale); text-transform: uppercase; margin-bottom: 30px; border-bottom: 2px solid var(--couleur-accent-secondaire); display: inline-block; }
        
        #cont-photos { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-top: 20px;
        }
        .photo-card { 
            background: #000; border-radius: 15px; overflow: hidden; 
            border: 1px solid #333; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .photo-card img { width: 100%; display: block; height: auto; }
        .photo-card iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* ADMINISTRATION SECURISEE */
        #login-zone { margin-top: 50px; padding-top: 20px; border-top: 1px solid #333; }
        #admin-box { 
            display: none; margin: 20px auto; padding: 25px; 
            background: #000; border-radius: 15px; border: 1px solid var(--couleur-principale);
            max-width: 400px;
        }
        .input-lvd { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border-radius: 10px; border: 1px solid #444; 
            background: #111; color: #fff; font-size: 16px; 
        }
        .btn-adm { 
            background: var(--couleur-principale); color: #000; 
            font-weight: bold; padding: 14px; border: none; 
            border-radius: 10px; cursor: pointer; width: 100%; 
            text-transform: uppercase;
        }

        .footer { background-color: #111; color: #555; text-align: center; padding: 30px; font-size: 12px; }

        @media (min-width: 768px) {
            #cont-photos { grid-template-columns: repeat(2, 1fr); gap: 30px; }
            .header h1 { font-size: 1.8rem; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-placeholder">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC GLOBAL INVESTISSEMENT</h1>
    </header>

    <section class="hero">
        <h2 class="hero-title">NOS RÉALISATIONS</h2>
        <p>Expertise et Investissement Global</p>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number">150+</span><span>Photos</span></div>
            <div class="stat-item"><span class="stat-number">25</span><span>Vidéos</span></div>
            <div class="stat-item" style="grid-column: span 2;"><span class="stat-number">5k+</span><span>Partenaires</span></div>
        </div>

        <div class="social-hero-links">
            <a href="https://wa.me/2693246465" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/" target="_blank"><i class="fab fa-facebook"></i></a>
        </div>
    </section>

    <section id="galerie" class="galerie-cloud">
        <h2>PORTFOLIO CLOUD</h2>
        <div id="cont-photos">
            <p style="opacity: 0.3; padding: 50px;">Connexion au serveur sécurisé...</p>
        </div>

        <div id="login-zone">
            <button id="btn-open-adm" onclick="this.style.display='none'; document.getElementById('auth-form').style.display='block'" style="background:transparent; border:1px solid #444; color:#555; padding:10px 20px; border-radius:10px; cursor:pointer;">ACCÈS ADMINISTRATEUR</button>
            
            <div id="auth-form" style="display:none; max-width:300px; margin:0 auto;">
                <input type="password" id="pass" placeholder="Code de sécurité" class="input-lvd">
                <button onclick="verifier()" class="btn-adm">Vérifier Identité</button>
            </div>
        </div>

        <div id="admin-box">
            <h3 style="color:var(--couleur-principale); margin-bottom:15px;">PUBLIER UN NOUVEAU PROJET</h3>
            <select id="m-type" class="input-lvd">
                <option value="image">IMAGE (Lien URL)</option>
                <option value="video">VIDÉO (Lien YouTube)</option>
            </select>
            <input type="url" id="m-url" placeholder="Collez le lien ici" class="input-lvd">
            <button onclick="publier()" class="btn-adm" style="background:var(--couleur-accent-secondaire)">Mettre en ligne</button>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 LVD GLOBAL INVESTISSEMENT. Tous droits réservés.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // PROTECTION CONTRE LES VARIABLES MANQUANTES
        const getCfg = () => {
            try { return JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}'); }
            catch(e) { return {}; }
        };
        const firebaseConfig = getCfg();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-global-prod';

        let db, col, estAdmin = false;

        async function start() {
            if (!firebaseConfig.apiKey) {
                console.error("Configuration Firebase absente.");
                return;
            }
            
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            col = collection(db, 'artifacts', appId, 'public', 'data', 'lvd_v4_final');

            await signInAnonymously(auth);
            ecouterDonnees();
        }

        function ecouterDonnees() {
            onSnapshot(col, (snap) => {
                const c = document.getElementById('cont-photos');
                c.innerHTML = '';
                let items = [];
                snap.forEach(d => items.push({id: d.id, ...d.data()}));
                items.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                if(items.length === 0) c.innerHTML = '<p style="opacity:0.2; padding:40px;">AUCUN PROJET EN LIGNE</p>';

                items.forEach(item => {
                    const d = document.createElement('div');
                    d.className = "photo-card";
                    if(item.type === 'video') {
                        let vid = item.url.includes('v=') ? item.url.split('v=')[1].split('&')[0] : item.url.split('/').pop();
                        d.innerHTML = <iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>;
                    } else {
                        d.innerHTML = <img src="${item.url}" onerror="this.src='https://placehold.co/400x300?text=Lien+Invalide'">;
                    }
                    if(estAdmin) {
                        const b = document.createElement('button');
                        b.innerHTML = '<i class="fas fa-trash"></i>';
                        b.style = "position:absolute; top:10px; right:10px; background:red; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;";
                        b.onclick = () => window.suppr(item.id);
                        d.appendChild(b);
                    }
                    c.appendChild(d);
                });
            });
        }

        window.verifier = () => {
            const p = document.getElementById('pass').value.trim();
            if(p.toUpperCase() === "LVD2024") {
                estAdmin = true;
                document.getElementById('admin-box').style.display = 'block';
                document.getElementById('auth-form').style.display = 'none';
                ecouterDonnees();
                alert("CONNEXION RÉUSSIE");
            } else {
                alert("CODE PIN INCORRECT");
            }
        };

        window.publier = async () => {
            const u = document.getElementById('m-url').value.trim();
            const t = document.getElementById('m-type').value;
            if(!u) return alert("Veuillez entrer un lien");
            try {
                await addDoc(col, { url: u, type: t, createdAt: serverTimestamp() });
                document.getElementById('m-url').value = '';
                alert("CONTENU PUBLIÉ !");
            } catch(e) { alert("ERREUR SERVEUR"); }
        };

        window.suppr = async (id) => {
            if(confirm("SUPPRIMER DÉFINITIVEMENT ?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lvd_v4_final', id));
            }
        };

        start();
    </script>
</body>
</html>
