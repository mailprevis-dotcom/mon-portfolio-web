<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --or: #FFD700; --noir: #05080a; --gris: #111827; }
        body { background: var(--noir); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        header { padding: 30px; border-bottom: 1px solid #1e293b; }
        .logo { width: 70px; height: 70px; background: white; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; border: 2px solid var(--or); }
        h1 { color: var(--or); font-size: 1.1rem; letter-spacing: 2px; margin: 5px 0; }
        .socials { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 10px; max-width: 500px; margin: 20px auto; padding: 10px; }
        .socials a { text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; font-weight: bold; }
        .socials i { font-size: 1.6rem; margin-bottom: 5px; }
        .fa-whatsapp { color: #25D366; } .fa-instagram { color: #E4405F; } .fa-facebook { color: #1877F2; } 
        .fa-x-twitter { color: white; } .fa-map-marker-alt { color: #EA4335; }
        .google-c { background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--gris); border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #1e293b; }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
        .admin-btn { background: none; border: none; color: #222; font-size: 1.2rem; cursor: pointer; margin: 40px 0; }
        #panel { display: none; background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid var(--or); max-width: 350px; margin: 20px auto; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        .save { background: var(--or); color: black; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .del { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; }
        footer { padding: 20px; font-size: 9px; opacity: 0.3; }
    </style>
</head>
<body>
    <header>
        <div class="logo">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
    </header>
    <div class="socials">
        <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i>WHATSAPP</a>
        <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i>INSTAGRAM</a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i>FACEBOOK</a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne"><i class="fab fa-tiktok"></i>TIKTOK</a>
        <a href="https://x.com/LDyonisienne"><i class="fab fa-x-twitter"></i>X</a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC"><i class="fas fa-map-marker-alt"></i>ADRESSE</a>
        <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC"><i class="fab fa-google google-c"></i>GOOGLE</a>
    </div>
    <div id="gal" class="gallery"></div>
    <button class="admin-btn" onclick="ask()"><i class="fas fa-lock"></i></button>
    <div id="panel">
        <input type="password" id="pw" placeholder="Code">
        <button class="save" onclick="login()">ENTRER</button>
        <div id="ctrl" style="display:none; margin-top:15px; border-top:1px solid #333; padding-top:15px;">
            <select id="ty"><option value="img">IMAGE</option><option value="vid">YOUTUBE</option></select>
            <input type="text" id="url" placeholder="Lien URL">
            <button class="save" onclick="add()">PUBLIER</button>
        </div>
    </div>
    <footer>&copy; 2025 LVD GLOBAL</footer>
    <script>
        let db = JSON.parse(localStorage.getItem('lvd_v5') || '[]');
        let adm = false;
        function ask() { document.getElementById('panel').style.display = 'block'; }
        function login() {
            if(document.getElementById('pw').value.toUpperCase()==="LVD2024"){
                adm=true; document.getElementById('ctrl').style.display='block'; show();
            } else { alert("Non"); }
        }
        function show() {
            const g = document.getElementById('gal');
            g.innerHTML = db.map((h, i) => `
                <div class="card">
                    ${h.type==='vid'?<iframe src="https://www.youtube.com/embed/${getID(h.url)}"></iframe>:<img src="${h.url}">}
                    ${adm?<button class="del" onclick="del(${i})">X</button>:''}
                </div>
            `).join('');
        }
        function getID(u) { const m = u.match(/[?&]v=([^&#]+)/) || u.match(/youtu\.be\/([^?&#]+)/); return m?m[1]:''; }
        function add() {
            const u=document.getElementById('url').value;
            const t=document.getElementById('ty').value;
            if(!u)return; db.unshift({url:u,type:t});
            localStorage.setItem('lvd_v5', JSON.stringify(db));
            document.getElementById('url').value=""; show();
        }
        function del(i) { if(confirm("Supprimer?")){db.splice(i,1); localStorage.setItem('lvd_v5', JSON.stringify(db)); show();} }
        show();
    </script>
</body>
</html>
