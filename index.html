<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LVD Global - Portfolio Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .gold { color: #FFD700; }
        .bg-gold { background-color: #FFD700; }
        .card { background: #0f172a; border-radius: 2rem; overflow: hidden; border: 1px solid #1e293b; transition: transform 0.3s ease; }
        .tab-active { border-bottom: 3px solid #FFD700; color: #FFD700; font-weight: 900; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- HEADER FIXE -->
    <nav class="p-4 bg-slate-900 border-b border-white/10 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="bg-white text-black px-2 py-0.5 rounded font-black text-[10px]">LVD</span>
            <span class="gold font-bold text-[10px] tracking-[0.2em] uppercase">Villa Dionysienne</span>
        </div>
        <div class="flex gap-4 items-center">
            <a href="https://wa.me/2693246465" target="_blank" class="text-green-500 text-xl"><i class="fab fa-whatsapp"></i></a>
        </div>
    </nav>

    <!-- NAVIGATION PAR ONGLETS -->
    <div class="flex glass border-b border-white/5 sticky top-[57px] z-40">
        <button id="tab-gal" onclick="switchView('gal')" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest tab-active">Réalisations</button>
        <button id="tab-adm" onclick="switchView('adm')" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest opacity-60">Gestion</button>
    </div>

    <main class="flex-grow p-4 max-w-md mx-auto w-full">
        
        <!-- VUE PUBLIQUE (GALERIE) -->
        <div id="view-gal">
            <div class="text-center py-8">
                <h2 class="text-3xl font-black italic uppercase tracking-tighter">Nos <span class="gold">Projets</span></h2>
                <p class="text-[9px] text-slate-500 uppercase tracking-[0.4em] mt-2 italic">Excellence Immobilière</p>
            </div>
            
            <div id="gallery-container" class="grid grid-cols-1 gap-8 pb-20">
                <div class="text-center py-20 opacity-30 text-xs uppercase tracking-widest animate-pulse italic">Synchronisation Cloud...</div>
            </div>
        </div>

        <!-- VUE ADMINISTRATION -->
        <div id="view-adm" class="hidden py-6">
            <!-- Formulaire Login -->
            <div id="admin-login" class="py-10 text-center">
                <div class="w-16 h-16 bg-slate-900 border border-white/10 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-lock gold text-xl"></i>
                </div>
                <h3 class="gold text-[10px] font-bold uppercase mb-8 tracking-[0.3em]">Espace Propriétaire</h3>
                <input type="password" id="pass-input" placeholder="MOT DE PASSE" class="w-full bg-black border border-slate-800 p-5 rounded-2xl text-center text-white mb-4 outline-none focus:border-gold">
                <button onclick="checkAccess()" class="w-full bg-gold text-black font-black p-5 rounded-2xl uppercase text-xs shadow-xl active:scale-95 transition-all">Accéder</button>
                <p class="text-[9px] text-slate-600 mt-6 uppercase italic">Indice : LVD + Année en cours</p>
            </div>

            <!-- Panneau d'administration -->
            <div id="admin-panel" class="hidden">
                <div class="bg-green-500/10 border border-green-500/20 p-4 rounded-2xl mb-8 flex items-center justify-between">
                    <p class="text-green-500 text-[10px] font-bold uppercase tracking-widest">Session Active</p>
                    <button onclick="location.reload()" class="text-slate-400 text-[10px] uppercase font-bold underline">Fermer</button>
                </div>
                
                <div class="space-y-6">
                    <div class="bg-slate-900/50 p-6 rounded-[2rem] border border-white/5">
                        <h3 class="gold text-[10px] font-bold uppercase mb-4 tracking-widest">Nouveau Contenu</h3>
                        
                        <label class="block text-[9px] uppercase text-slate-500 mb-2 ml-1">Type de média</label>
                        <select id="media-type" class="w-full bg-black border border-slate-800 p-4 rounded-xl text-white text-xs mb-4 outline-none">
                            <option value="image">Photo (Lien direct .jpg/.png)</option>
                            <option value="video">Vidéo (Lien YouTube)</option>
                        </select>

                        <label class="block text-[9px] uppercase text-slate-500 mb-2 ml-1">Lien du média</label>
                        <input type="url" id="media-url" placeholder="Collez le lien ici..." class="w-full bg-black border border-slate-800 p-4 rounded-xl text-white text-xs mb-6 outline-none focus:border-green-500">
                        
                        <button onclick="publishMedia()" id="btn-pub" class="w-full bg-green-500 text-black font-black p-4 rounded-xl uppercase text-[10px] shadow-lg">Publier sur le site</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center opacity-20 mt-auto">
        <p class="text-[9px] uppercase tracking-[0.4em]">LVD Global Invest © 2024</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIGURATION FIREBASE
        const firebaseConfig = JSON.parse('__firebase_config');
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = '__app_id';
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'lvd_cloud_vfinal');

        let isAdmin = false;

        // AUTHENTIFICATION
        async function init() {
            try {
                await signInAnonymously(auth);
                listenToData();
            } catch(e) { console.error("Erreur Cloud:", e); }
        }

        // CHARGEMENT DES DONNÉES
        function listenToData() {
            onSnapshot(colRef, (snap) => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';
                
                let items = [];
                snap.forEach(d => items.push({id: d.id, ...d.data()}));
                items.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                if(items.length === 0) {
                    container.innerHTML = '<div class="py-20 text-center opacity-20 uppercase text-[9px] font-bold tracking-[0.3em]">Aucun projet à afficher</div>';
                    return;
                }

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "card shadow-2xl relative";
                    
                    let mediaHTML = '';
                    if(item.type === 'video') {
                        // Gestion lien YouTube
                        let ytId = extractYoutubeId(item.url);
                        mediaHTML = <iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>;
                    } else {
                        mediaHTML = <img src="${item.url}" class="w-full aspect-square object-cover" onerror="this.src='https://placehold.co/600x600/0f172a/FFD700?text=Image+Non+Disponible'">;
                    }

                    div.innerHTML = `
                        ${mediaHTML}
                        <div class="p-6 bg-gradient-to-t from-slate-950 to-slate-900">
                            <div class="flex justify-between items-center">
                                <span class="gold text-[10px] font-black italic uppercase tracking-widest">LVD Global MC</span>
                                ${isAdmin ? <button onclick="window.deleteItem('${item.id}')" class="text-red-500 text-sm"><i class="fas fa-trash-alt"></i></button> : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function extractYoutubeId(url) {
            const regExp = /^.(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]).*/;
            const match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : url;
        }

        // GESTIONNAIRE
        window.checkAccess = () => {
            const pass = document.getElementById('pass-input').value;
            // MOT DE PASSE : LVD2024
            if(pass.toUpperCase() === "LVD2024") {
                isAdmin = true;
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                listenToData();
            } else {
                alert("Mot de passe incorrect");
            }
        };

        window.publishMedia = async () => {
            const url = document.getElementById('media-url').value.trim();
            const type = document.getElementById('media-type').value;
            if(!url) return alert("Veuillez entrer un lien");

            const btn = document.getElementById('btn-pub');
            btn.disabled = true; btn.innerText = "PUBLICATION EN COURS...";

            try {
                await addDoc(colRef, {
                    url: url,
                    type: type,
                    createdAt: serverTimestamp()
                });
                document.getElementById('media-url').value = '';
                alert("Publié sur le site avec succès !");
            } catch(e) {
                alert("Erreur lors de la publication Cloud");
            }
            btn.disabled = false; btn.innerText = "Publier sur le site";
        };

        window.deleteItem = async (id) => {
            if(confirm("Supprimer définitivement ce contenu ?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lvd_cloud_vfinal', id));
            }
        };

        window.switchView = (type) => {
            document.getElementById('view-gal').classList.toggle('hidden', type !== 'gal');
            document.getElementById('view-adm').classList.toggle('hidden', type !== 'adm');
            document.getElementById('tab-gal').classList.toggle('tab-active', type === 'gal');
            document.getElementById('tab-adm').classList.toggle('tab-active', type === 'adm');
            document.getElementById('tab-gal').classList.toggle('opacity-60', type !== 'gal');
            document.getElementById('tab-adm').classList.toggle('opacity-60', type !== 'adm');
        };

        init();
    </script>
</body>
</html>
