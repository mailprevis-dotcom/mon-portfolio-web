<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    
    <style>
        :root { --or: #FFD700; --noir: #05080a; --carte: #111b27; }
        body { background: var(--noir); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; text-align: center; }
        
        header { padding: 40px 20px; border-bottom: 1px solid #1e293b; }
        /* Logo cliquable pour ouvrir l'admin */
        .logo-btn { 
            width: 75px; height: 75px; background: white; color: black; 
            border-radius: 50%; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 3px solid var(--or); cursor: pointer;
            font-size: 22px; transition: transform 0.2s;
        }
        .logo-btn:active { transform: scale(0.95); }
        h1 { color: var(--or); font-size: 1.2rem; margin: 0; letter-spacing: 2px; text-transform: uppercase; }

        /* RÉSEAUX SOCIAUX */
        .social-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 25px; }
        .social-item { 
            background: var(--carte); padding: 12px; border-radius: 12px; 
            text-decoration: none; color: white; width: 68px; border: 1px solid #1e293b;
        }
        .social-item img { width: 30px; height: 30px; }
        .social-item span { display: block; font-size: 8px; margin-top: 6px; font-weight: bold; color: #94a3b8; }

        /* GALERIE */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: var(--carte); border-radius: 15px; overflow: hidden; border: 1px solid #1e293b; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; object-fit: cover; }

        /* ZONE ADMIN CACHÉE */
        .admin-panel { 
            display: none; padding: 40px 20px; background: #080c14; 
            border-top: 2px solid var(--or); margin-top: 40px; 
        }
        .input-style { 
            width: 90%; max-width: 320px; padding: 15px; margin: 10px 0; 
            border-radius: 8px; border: 1px solid #334155; background: #000; color: white; 
            font-size: 16px; text-align: center;
        }
        .gold-btn { 
            background: var(--or); color: black; border: none; 
            padding: 15px; border-radius: 8px; font-weight: bold; 
            width: 90%; max-width: 320px; cursor: pointer; font-size: 16px;
        }
        .hidden { display: none; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; border: none; border-radius: 5px; padding: 8px 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <!-- CLIQUER ICI POUR AFFICHER LA CONNEXION -->
        <div class="logo-btn" onclick="ouvrirGestion()">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p style="font-size: 10px; opacity: 0.6; letter-spacing: 4px; margin-top: 8px;">GLOBAL INVESTISSEMENT</p>
    </header>

    <div class="social-container">
        <a href="https://wa.me/2693246465" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><span>WHATSAPP</span></a>
        <a href="https://www.instagram.com/la_villa_dionysienne" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"><span>INSTAGRAM</span></a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/124/124010.png"><span>FACEBOOK</span></a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"><span>TIKTOK</span></a>
        <a href="https://x.com/LDyonisienne" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png"><span>X</span></a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/854/854878.png"><span>ADRESSE</span></a>
    </div>

    <h2 style="font-weight: 300; letter-spacing: 3px; margin: 30px 0;">NOS RÉALISATIONS</h2>
    <div id="gallery-list" class="gallery">
        <p style="opacity:0.2; grid-column: 1/-1;">Chargement...</p>
    </div>

    <!-- ZONE ADMINISTRATIVE -->
    <div id="admin-box" class="admin-panel">
        <div id="login-form">
            <h3 style="color:var(--or)">ACCÈS SÉCURISÉ</h3>
            <input type="password" id="password-input" class="input-style" placeholder="Code secret">
            <button class="gold-btn" onclick="connexion()">DÉBLOQUER</button>
        </div>

        <div id="upload-form" class="hidden">
            <h3 style="color:var(--or)">AJOUTER UN PROJET</h3>
            <select id="type-select" class="input-style">
                <option value="img">IMAGE (URL)</option>
                <option value="vid">YOUTUBE (LIEN)</option>
            </select>
            <input type="text" id="url-input" class="input-style" placeholder="Collez le lien ici">
            <button class="gold-btn" onclick="ajouter()">PUBLIER SUR LE SITE</button>
            <p><button onclick="location.reload()" style="background:none; border:none; color:#64748b; cursor:pointer; font-size:12px; text-decoration:underline;">QUITTER LA SESSION</button></p>
        </div>
    </div>

    <script>
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-global-final-v2';
        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let loggedIn = false;
        firebase.auth().signInAnonymously();

        function ouvrirGestion() {
            const box = document.getElementById('admin-box');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function connexion() {
            const code = document.getElementById('password-input').value.toUpperCase();
            if(code === "LVD2024") {
                loggedIn = true;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('upload-form').classList.remove('hidden');
                charger();
            } else {
                alert("Code incorrect");
            }
        }

        function charger() {
            col.orderBy('date', 'desc').onSnapshot(snap => {
                const list = document.getElementById('gallery-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = "card";
                    if(data.type === 'vid') {
                        const id = data.url.split('v=')[1] || data.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}"></iframe>;
                    } else {
                        card.innerHTML = <img src="${data.url}" onerror="this.src='https://placehold.co/600x400/111b27/FFFFFF?text=Image+non+disponible'">;
                    }
                    if(loggedIn) {
                        const btn = document.createElement('button');
                        btn.className = "btn-delete"; btn.innerText = "EFFACER";
                        btn.onclick = () => { if(confirm("Supprimer ce projet ?")) doc.ref.delete(); };
                        card.appendChild(btn);
                    }
                    list.appendChild(card);
                });
            });
        }

        async function ajouter() {
            const url = document.getElementById('url-input').value.trim();
            const type = document.getElementById('type-select').value;
            if(!url) return;
            try {
                await col.add({ url: url, type: type, date: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('url-input').value = "";
                alert("Projet publié !");
            } catch(e) { alert("Erreur d'envoi"); }
        }

        charger();
    </script>
</body>
</html>
