<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --or: #FFD700;
            --vert: #00FF7F;
            --fond: #05080a;
            --carte: #111827;
            --texte: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--fond); 
            color: var(--texte);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f172a, var(--fond));
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .logo-box {
            width: 85px;
            height: 85px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--or);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .logo-box span { color: #000; font-weight: bold; font-size: 24px; }

        h1 { font-size: 1.5rem; color: var(--or); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .subtitle { font-size: 0.8rem; opacity: 0.7; letter-spacing: 4px; text-transform: uppercase; }

        .section-main { padding: 40px 10px; text-align: center; flex: 1; }
        .section-title { font-size: 1.4rem; font-weight: 300; margin-bottom: 30px; letter-spacing: 2px; }

        /* GRILLE RÉSEAUX */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 20px;
            margin: 0 auto 40px;
            max-width: 800px;
            padding: 0 10px;
        }
        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-link i { font-size: 2.2rem; margin-bottom: 10px; }
        .social-link span { font-size: 10px; text-transform: uppercase; color: #888; font-weight: bold; }

        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }
        .fa-tiktok, .fa-x-twitter { color: #FFFFFF; }
        .fa-map-marker-alt { color: #EA4335; }

        .google-icon {
            font-weight: 900;
            background: linear-gradient(to right, #4285F4 25%, #EA4335 25% 50%, #FBBC05 50% 75%, #34A853 75%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
        }

        /* BOUTON GESTIONNAIRE VISIBLE */
        .btn-admin-access {
            background: transparent;
            border: 1px solid var(--or);
            color: var(--or);
            padding: 12px 25px;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 50px;
        }
        .btn-admin-access:hover { background: var(--or); color: #000; }

        /* GALERIE */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .item-card {
            background: var(--carte);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .item-card img, .item-card iframe {
            width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; border: none;
        }

        /* MODALE */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 10000;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-inner {
            background: #0d1117;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--or);
            text-align: center;
        }
        input, select {
            width: 100%; padding: 15px; margin: 12px 0;
            border-radius: 10px; border: 1px solid #333;
            background: #000; color: #fff; font-size: 16px;
        }
        .btn-main {
            width: 100%; padding: 16px; border-radius: 10px; border: none;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold { background: var(--or); color: #000; }
        .btn-green { background: var(--vert); color: #000; margin-top: 10px; }
        .btn-close { background: none; color: #555; margin-top: 15px; }

        .btn-del {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,0,0,0.8); color: white; border: none; 
            padding: 10px; border-radius: 50%; cursor: pointer;
        }

        footer {
            padding: 30px; text-align: center; background: #000; font-size: 10px; opacity: 0.4;
        }

        @media (max-width: 600px) {
            .social-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box"><span>LVD</span></div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
        <p class="subtitle">Global Investissement</p>
    </header>

    <main class="section-main">
        <h2 class="section-title">Espace d'Excellence</h2>
        
        <div class="social-grid">
            <a href="https://wa.me/2693246465" class="social-link"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
            <a href="https://www.instagram.com/la_villa_dionysienne" class="social-link"><i class="fab fa-instagram"></i><span>Instagram</span></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/" class="social-link"><i class="fab fa-facebook"></i><span>Facebook</span></a>
            <a href="https://www.tiktok.com/@la_villa_dionysienne" class="social-link"><i class="fab fa-tiktok"></i><span>TikTok</span></a>
            <a href="https://x.com/LDyonisienne" target="_blank" class="social-link"><i class="fab fa-x-twitter"></i><span>X / Twitter</span></a>
            <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC" class="social-link"><i class="fas fa-map-marker-alt"></i><span>Adresse</span></a>
            <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC" class="social-link"><i class="fab fa-google google-icon"></i><span>Google</span></a>
        </div>

        <!-- Bouton de gestionnaire maintenant bien visible -->
        <button class="btn-admin-access" onclick="openM('modal-login')">Accès Gestionnaire</button>

        <div id="gallery" class="gallery-grid">
            <!-- Contenu dynamique -->
        </div>
    </main>

    <footer>
        &copy; 2025 LVD GLOBAL INVESTISSEMENT
    </footer>

    <!-- Fenêtre de Connexion -->
    <div id="modal-login" class="modal">
        <div class="modal-inner">
            <h3 style="color:var(--or); margin-bottom:20px;">CONNEXION</h3>
            <input type="password" id="pass" placeholder="Entrez le mot de passe">
            <button class="btn-main btn-gold" onclick="checkPass()">VALIDER</button>
            <button class="btn-main btn-close" onclick="closeM('modal-login')">ANNULER</button>
        </div>
    </div>

    <!-- Fenêtre de Publication -->
    <div id="modal-admin" class="modal">
        <div class="modal-inner">
            <h3 style="color:var(--vert); margin-bottom:20px;">PUBLIER</h3>
            <select id="type">
                <option value="img">IMAGE (URL)</option>
                <option value="vid">YOUTUBE (Lien)</option>
            </select>
            <input type="url" id="url" placeholder="Collez le lien ici">
            <button class="btn-main btn-green" onclick="save()">METTRE EN LIGNE</button>
            <button class="btn-main btn-close" onclick="location.reload()">DÉCONNEXION</button>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('lvd_v3_data') || '[]');
        let isAdmin = false;

        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        function checkPass() {
            const p = document.getElementById('pass').value.toUpperCase();
            if(p === "LVD2024") {
                isAdmin = true;
                closeM('modal-login');
                openM('modal-admin');
                render();
            } else {
                alert("Mot de passe incorrect.");
            }
        }

        function render() {
            const container = document.getElementById('gallery');
            if(items.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1; opacity:0.1; padding:40px;">Aucun projet affiché.</p>';
                return;
            }
            container.innerHTML = items.map((it, i) => `
                <div class="item-card">
                    ${it.type === 'vid' ? 
                        <iframe src="https://www.youtube.com/embed/${getV(it.url)}" allowfullscreen></iframe> : 
                        <img src="${it.url}" onerror="this.src='https://placehold.co/600x400/111827/ffffff?text=Image+Indisponible'">
                    }
                    ${isAdmin ? <button class="btn-del" onclick="del(${i})"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        function getV(u) {
            const r = /^.(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]).*/;
            const m = u.match(r);
            return (m && m[2].length === 11) ? m[2] : '';
        }

        function save() {
            const u = document.getElementById('url').value.trim();
            const t = document.getElementById('type').value;
            if(!u) return;
            items.unshift({ url: u, type: t });
            localStorage.setItem('lvd_v3_data', JSON.stringify(items));
            document.getElementById('url').value = '';
            render();
            alert("Projet ajouté !");
        }

        function del(i) {
            if(confirm("Supprimer ce projet ?")) {
                items.splice(i, 1);
                localStorage.setItem('lvd_v3_data', JSON.stringify(items));
                render();
            }
        }

        render();
    </script>
</body>
</html>
