<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA VILLA DIONYSIENNE MC - Global Investissement</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        :root {
            --gold: #FFD700; 
            --green: #00FF7F; 
            --bg-dark: #111827; 
            --bg-card: #1f2a38; 
            --text: #ecf0f1; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text); line-height: 1.6; }
        
        .header { 
            background-color: var(--bg-card); 
            padding: 20px 0; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            text-align: center;
        }
        
        .logo-circle { 
            height: 60px; width: 60px; background: #fff; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--gold); font-weight: bold; border: 2px solid var(--gold);
        }

        .header h1 { font-size: 1rem; color: var(--gold); text-transform: uppercase; padding: 0 10px; }

        .hero { padding: 50px 20px; text-align: center; border-bottom: 4px solid var(--green); }
        .hero h2 { color: var(--gold); font-size: 1.8rem; margin-bottom: 15px; }
        
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 25px auto; max-width: 400px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid var(--green); }
        .stat-num { display: block; font-size: 1.4rem; font-weight: bold; color: var(--gold); }

        .social-bar { display: flex; justify-content: center; gap: 25px; margin-top: 20px; }
        .social-bar a { font-size: 2.2rem; text-decoration: none; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

        .galerie { padding: 40px 15px; background: #0f172a; text-align: center; }
        .galerie h2 { color: var(--gold); margin-bottom: 25px; border-bottom: 2px solid var(--green); display: inline-block; }
        
        #cont-photos { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; position: relative; }
        .card img { width: 100%; display: block; }
        .card iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* ADMIN STYLE */
        #admin-section { margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
        #btn-login-toggle { background: transparent; color: #555; border: 1px solid #444; padding: 10px; border-radius: 5px; font-size: 10px; cursor: pointer; }
        
        #admin-panel { display: none; max-width: 350px; margin: 20px auto; background: #000; padding: 20px; border-radius: 10px; border: 1px solid var(--gold); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; }
        .btn-action { background: var(--gold); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        @media (min-width: 768px) {
            #cont-photos { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-circle">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC GLOBAL INVESTISSEMENT</h1>
    </header>

    <section class="hero">
        <h2>NOS RÉALISATIONS</h2>
        <div class="stats">
            <div class="stat-box"><span class="stat-num">150+</span>Photos</div>
            <div class="stat-box"><span class="stat-num">25</span>Vidéos</div>
        </div>
        <div class="social-bar">
            <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        </div>
    </section>

    <section class="galerie">
        <h2>PORTFOLIO</h2>
        <div id="cont-photos">
            <p style="opacity:0.2">Chargement du portfolio...</p>
        </div>

        <div id="admin-section">
            <button id="btn-login-toggle" onclick="document.getElementById('admin-panel').style.display='block'; this.style.display='none'">GÉRER LE SITE</button>
            
            <div id="admin-panel">
                <div id="auth-box">
                    <input type="password" id="pass" placeholder="Mot de passe">
                    <button onclick="checkAccess()" class="btn-action">CONNEXION</button>
                </div>
                
                <div id="post-box" style="display:none;">
                    <h4 style="color:var(--gold); margin-bottom:10px;">AJOUTER UN CONTENU</h4>
                    <select id="m-type">
                        <option value="image">IMAGE (Lien URL)</option>
                        <option value="video">YOUTUBE (Lien URL)</option>
                    </select>
                    <input type="url" id="m-url" placeholder="Lien de la photo ou vidéo">
                    <button onclick="handlePublish()" class="btn-action" style="background:var(--green)">PUBLIER</button>
                    <button onclick="location.reload()" style="background:none; border:none; color:red; margin-top:15px; font-size:12px; cursor:pointer;">DÉCONNEXION</button>
                </div>
            </div>
        </div>
    </section>

    <footer style="text-align:center; padding:30px; background:#000; color:#444; font-size:10px;">
        &copy; 2025 LVD GLOBAL INVESTISSEMENT
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIGURATION SECURISEE
        const config = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-lvd';
        
        let db, col, isAdmin = false;
        let localData = JSON.parse(localStorage.getItem('lvd_backup') || '[]');

        async function init() {
            const container = document.getElementById('cont-photos');

            // TEST SI CONFIGURATION DISPONIBLE
            if (!config.apiKey) {
                console.warn("Mode local activé (Firebase non configuré sur ce domaine)");
                render(localData);
                return;
            }

            try {
                const app = initializeApp(config);
                db = getFirestore(app);
                const auth = getAuth(app);
                col = collection(db, 'artifacts', appId, 'public', 'data', 'lvd_final_v5');
                
                await signInAnonymously(auth);
                
                onSnapshot(col, (snap) => {
                    let items = [];
                    snap.forEach(d => items.push({id: d.id, ...d.data()}));
                    items.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    render(items);
                    localStorage.setItem('lvd_backup', JSON.stringify(items));
                });
            } catch (e) {
                render(localData);
            }
        }

        function render(data) {
            const container = document.getElementById('cont-photos');
            if(data.length === 0) {
                container.innerHTML = '<p style="opacity:0.2; padding:40px;">AUCUN PROJET</p>';
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="card">
                    ${item.type === 'video' ? 
                        <iframe src="https://www.youtube.com/embed/${getYTId(item.url)}" allowfullscreen></iframe> : 
                        <img src="${item.url}" onerror="this.src='https://placehold.co/400x300?text=Image+Introuvable'">
                    }
                    ${isAdmin ? <button onclick="window.removePost('${item.id}')" style="position:absolute; top:10px; right:10px; background:red; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        function getYTId(url) {
            return url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
        }

        window.checkAccess = () => {
            if(document.getElementById('pass').value.toUpperCase() === "LVD2024") {
                isAdmin = true;
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('post-box').style.display = 'block';
                init(); // Recharge avec les boutons supprimer
                alert("ACCÈS AUTORISÉ");
            } else {
                alert("MOT DE PASSE INCORRECT");
            }
        };

        window.handlePublish = async () => {
            const url = document.getElementById('m-url').value.trim();
            const type = document.getElementById('m-type').value;
            if(!url) return alert("Lien manquant");

            if(col) {
                await addDoc(col, { url, type, createdAt: serverTimestamp() });
            } else {
                localData.unshift({ url, type, id: Date.now().toString() });
                localStorage.setItem('lvd_backup', JSON.stringify(localData));
                render(localData);
            }
            document.getElementById('m-url').value = '';
            alert("PUBLIÉ !");
        };

        window.removePost = async (id) => {
            if(!confirm("Supprimer ?")) return;
            if(col) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lvd_final_v5', id));
            } else {
                localData = localData.filter(i => i.id !== id);
                localStorage.setItem('lvd_backup', JSON.stringify(localData));
                render(localData);
            }
        };

        init();
    </script>
</body>
</html>
