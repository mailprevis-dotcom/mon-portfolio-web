<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD GLOBAL - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --or: #FFD700;
            --vert: #00FF7F;
            --fond: #111827;
            --carte: #1f2a38;
            --texte: #ecf0f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--fond); color: var(--texte); }

        /* Navigation */
        .nav { background: var(--carte); padding: 15px; text-align: center; border-bottom: 2px solid var(--or); position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; color: var(--or); text-transform: uppercase; }

        /* Hero */
        .hero { padding: 40px 20px; text-align: center; background: #000; border-bottom: 3px solid var(--vert); }
        .hero h2 { color: var(--or); margin-bottom: 10px; }
        .socials { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .socials a { font-size: 2rem; text-decoration: none; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }

        /* Galerie */
        .galerie { padding: 30px 15px; }
        #grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .item { background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #333; position: relative; }
        .item img { width: 100%; display: block; }
        .item iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* Admin */
        .admin-zone { margin-top: 50px; text-align: center; border-top: 1px solid #333; padding: 20px; }
        #admin-panel { display: none; background: #000; padding: 20px; border-radius: 10px; border: 1px solid var(--or); margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; }
        .btn { background: var(--or); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .del-btn { position: absolute; top: 10px; right: 10px; background: red; color: #fff; border: none; padding: 8px; border-radius: 5px; }

        @media (min-width: 600px) { #grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="nav">
        <h1>LVD GLOBAL INVESTISSEMENT</h1>
    </div>

    <div class="hero">
        <h2>NOS RÉALISATIONS</h2>
        <div class="socials">
            <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i></a>
        </div>
    </div>

    <div class="galerie">
        <div id="grid">
            <p id="msg-status" style="text-align:center; padding:50px;">Initialisation...</p>
        </div>
    </div>

    <div class="admin-zone">
        <button id="show-admin" onclick="this.style.display='none'; document.getElementById('admin-panel').style.display='block'" style="opacity:0.3; background:none; color:#555; border:none; cursor:pointer;">Gestionnaire</button>
        <div id="admin-panel">
            <div id="auth">
                <input type="password" id="pass" placeholder="Mot de passe">
                <button class="btn" onclick="check()">VALIDER</button>
            </div>
            <div id="tools" style="display:none;">
                <select id="type">
                    <option value="img">IMAGE (Lien URL)</option>
                    <option value="vid">YOUTUBE (Lien URL)</option>
                </select>
                <input type="url" id="url" placeholder="Coller le lien ici">
                <button class="btn" onclick="add()" style="background:var(--vert)">PUBLIER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const cfg = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const aid = typeof __app_id !== 'undefined' ? __app_id : 'lvd-v6';
        let db, col, isAdmin = false;

        // Fonction d'affichage
        function render(items) {
            const grid = document.getElementById('grid');
            if(items.length === 0) {
                grid.innerHTML = '<p style="text-align:center; opacity:0.3;">AUCUNE RÉALISATION</p>';
                return;
            }
            grid.innerHTML = items.map(it => `
                <div class="item">
                    ${it.type === 'vid' ? <iframe src="https://www.youtube.com/embed/${it.url.split('v=')[1] || it.url.split('/').pop()}" allowfullscreen></iframe> : <img src="${it.url}" onerror="this.src='https://placehold.co/400x300?text=Erreur+Image'">}
                    ${isAdmin ? <button class="del-btn" onclick="window.remove('${it.id}')"><i class="fas fa-trash"></i></button> : ''}
                </div>
            `).join('');
        }

        // Sécurité chargement infini
        setTimeout(() => {
            if(document.getElementById('msg-status')) {
                document.getElementById('msg-status').innerHTML = "Mode hors-ligne activé.";
                render(JSON.parse(localStorage.getItem('lvd_cache') || '[]'));
            }
        }, 3000);

        async function init() {
            if (!cfg.apiKey) return;
            try {
                const app = initializeApp(cfg);
                db = getFirestore(app);
                const auth = getAuth(app);
                col = collection(db, 'artifacts', aid, 'public', 'data', 'lvd_v6');
                await signInAnonymously(auth);
                onSnapshot(col, (s) => {
                    let d = [];
                    s.forEach(doc => d.push({id: doc.id, ...doc.data()}));
                    d.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    render(d);
                    localStorage.setItem('lvd_cache', JSON.stringify(d));
                });
            } catch(e) { console.error(e); }
        }

        window.check = () => {
            if(document.getElementById('pass').value.toUpperCase() === "LVD2024") {
                isAdmin = true;
                document.getElementById('auth').style.display = 'none';
                document.getElementById('tools').style.display = 'block';
                init(); // Rafraîchir pour voir les boutons supprimer
                alert("Bienvenue Admin");
            } else { alert("Code incorrect"); }
        }

        window.add = async () => {
            const u = document.getElementById('url').value;
            const t = document.getElementById('type').value;
            if(!u) return;
            if(col) {
                await addDoc(col, { url:u, type:t, createdAt: serverTimestamp() });
            } else {
                let cache = JSON.parse(localStorage.getItem('lvd_cache') || '[]');
                cache.unshift({url:u, type:t, id: Date.now()});
                localStorage.setItem('lvd_cache', JSON.stringify(cache));
                render(cache);
            }
            document.getElementById('url').value = '';
        }

        window.remove = async (id) => {
            if(!confirm("Supprimer ?")) return;
            if(col) await deleteDoc(doc(db, 'artifacts', aid, 'public', 'data', 'lvd_v6', id));
        }

        init();
    </script>
</body>
</html>
