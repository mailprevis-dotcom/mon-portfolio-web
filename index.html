<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVD Global Investissement</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    
    <!-- Icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root { --or: #FFD700; --fond: #05080a; }
        body { background: var(--fond); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        
        header { padding: 30px; border-bottom: 1px solid #1e293b; }
        .logo { width: 70px; height: 70px; background: white; color: black; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--or); }
        h1 { color: var(--or); font-size: 1.1rem; letter-spacing: 2px; }

        /* RÉSEAUX SOCIAUX */
        .social-nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 20px; }
        .social-nav a { color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; width: 60px; font-size: 8px; font-weight: bold; }
        .social-nav i { font-size: 1.8rem; margin-bottom: 5px; }
        .fa-whatsapp { color: #25D366; } .fa-instagram { color: #E4405F; } .fa-facebook { color: #1877F2; }
        .fa-tiktok, .fa-x-twitter { color: white; } .fa-map-marker-alt { color: #EA4335; } .fa-google { color: #FBBC05; }

        /* GALERIE */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: #111827; border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .card img, .card iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

        /* PANNEAU ADMIN DIRECT (Caché par défaut) */
        #admin-panel { display: none; background: #0f172a; border: 2px solid var(--or); margin: 20px; padding: 20px; border-radius: 10px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-publier { background: var(--or); color: black; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LVD</div>
        <h1>LA VILLA DIONYSIENNE MC</h1>
    </header>

    <!-- TOUS LES RÉSEAUX SOCIAUX -->
    <div class="social-nav">
        <a href="https://wa.me/2693246465"><i class="fab fa-whatsapp"></i>WHATSAPP</a>
        <a href="https://www.instagram.com/la_villa_dionysienne"><i class="fab fa-instagram"></i>INSTAGRAM</a>
        <a href="https://www.facebook.com/share/1FcL1xJvfv/"><i class="fab fa-facebook"></i>FACEBOOK</a>
        <a href="https://www.tiktok.com/@la_villa_dionysienne"><i class="fab fa-tiktok"></i>TIKTOK</a>
        <a href="https://x.com/LDyonisienne"><i class="fab fa-x-twitter"></i>X</a>
        <a href="https://www.google.com/maps?q=LA+VILLA+DIONYSIENNE+MC"><i class="fas fa-map-marker-alt"></i>ADRESSE</a>
        <a href="https://www.google.com/search?q=LA+VILLA+DIONYSIENNE+MC"><i class="fab fa-google"></i>GOOGLE</a>
    </div>

    <!-- PANNEAU DE GESTION DIRECT -->
    <div id="admin-panel">
        <h3 style="color:var(--or); margin-top:0;">MODE ÉDITION ACTIVÉ</h3>
        <input type="password" id="pass" placeholder="Code secret (LVD2024)">
        <div id="admin-tools" style="display:none; border-top:1px solid #333; margin-top:15px; padding-top:15px;">
            <select id="type"><option value="img">IMAGE</option><option value="vid">YOUTUBE</option></select>
            <input type="text" id="url" placeholder="Collez le lien ici">
            <button class="btn-publier" onclick="ajouter()">PUBLIER SUR LE SITE</button>
        </div>
    </div>

    <h2 style="font-weight: 300; margin-top: 30px;">PROJETS RÉCENTS</h2>
    <div id="gallery" class="gallery"></div>

    <script>
        // Config Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lvd-global-v1';
        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('gallery');

        let isAdmin = false;

        firebase.auth().signInAnonymously();

        // DÉTECTION DU MODE ADMIN PAR L'URL
        if (window.location.search.includes('admin')) {
            document.getElementById('admin-panel').style.display = 'block';
        }

        // Vérification du mot de passe en temps réel
        document.getElementById('pass').addEventListener('input', function(e) {
            if (e.target.value.toUpperCase() === "LVD2024") {
                isAdmin = true;
                document.getElementById('admin-tools').style.display = 'block';
                document.getElementById('pass').style.display = 'none';
                charger();
            }
        });

        function charger() {
            col.orderBy('date', 'desc').onSnapshot(snap => {
                const container = document.getElementById('gallery');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const card = document.createElement('div');
                    card.className = "card";
                    if(d.type === 'vid') {
                        const id = d.url.split('v=')[1] || d.url.split('/').pop();
                        card.innerHTML = <iframe src="https://www.youtube.com/embed/${id}"></iframe>;
                    } else {
                        card.innerHTML = <img src="${d.url}">;
                    }
                    if(isAdmin) {
                        const btn = document.createElement('button');
                        btn.className = "delete-btn"; btn.innerText = "SUPPRIMER";
                        btn.onclick = () => { if(confirm("Supprimer ?")) doc.ref.delete(); };
                        card.appendChild(btn);
                    }
                    container.appendChild(card);
                });
            });
        }

        async function ajouter() {
            const u = document.getElementById('url').value;
            const t = document.getElementById('type').value;
            if(!u) return;
            try {
                await col.add({ url: u, type: t, date: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('url').value = "";
                alert("Enregistré !");
            } catch(e) { alert("Erreur"); }
        }

        charger();
    </script>
</body>
</html>
